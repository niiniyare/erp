<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine.js Debug Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="p-8">
    <div x-data="{ open: false }" class="space-y-4">
        <h1 class="text-2xl font-bold">Alpine.js Debug Test</h1>
        
        <button 
            @click="open = !open"
            class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
        >
            Toggle Content
        </button>
        
        <div x-show="open" x-transition class="p-4 bg-gray-100 rounded">
            <p>This content is controlled by Alpine.js!</p>
            <p x-text="'Open state: ' + open"></p>
        </div>
        
        <div x-data="{ count: 0 }" class="space-y-2">
            <p>Counter test:</p>
            <button @click="count++" class="px-4 py-2 bg-green-500 text-white rounded">
                Click me
            </button>
            <p x-text="'Count: ' + count"></p>
        </div>
    </div>
</body>
</html>
