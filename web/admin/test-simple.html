<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amis Test</title>
    <link rel="stylesheet" href="https://unpkg.com/@fortawesome/fontawesome-free@6.1.1/css/all.min.css" />
    <link rel="stylesheet" href="/admin/lib/amis-cxd.css" />
    <link rel="stylesheet" href="/admin/lib/amis-helper.css" />
</head>
<body>
    <div id="root" style="height: 100vh"></div>
    
    <script src="/admin/lib/amis.min.js"></script>
    <script type="text/javascript">
        (function () {
            // Test if amis is loaded
            console.log('Amis object:', typeof amis, amis);
            
            // Define a simple schema
            let amisSchemaJSON = {
                type: "page",
                title: "Hello Amis!",
                body: [
                    {
                        type: "alert",
                        body: "Hello, world! Amis is working!",
                        level: "info"
                    },
                    {
                        type: "form",
                        body: [
                            {
                                label: "Name",
                                type: "input-text",
                                name: "name"
                            },
                            {
                                label: "Email",
                                type: "input-email", 
                                name: "email"
                            }
                        ]
                    }
                ]
            };

            // Render the page
            if (typeof amis !== 'undefined' && amis.embed) {
                let amisInstance = amis.embed('#root', amisSchemaJSON);
                console.log('Amis instance created:', amisInstance);
            } else {
                console.error('Amis not available or embed function missing');
                document.getElementById('root').innerHTML = '<h1>Error: Amis failed to load</h1>';
            }
        })();
    </script>
</body>
</html>
