<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AWO ERP</title>

  <!-- AMIS SDK — served at /sdk/ by Go static handler -->
  <link rel="stylesheet" href="/sdk/sdk.css">
  <link rel="stylesheet" href="/sdk/helper.css">
  <link rel="stylesheet" href="/sdk/iconfont.css">

  <!-- Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">

  <style>
    /* ─────────────────────────────────────────────
       Design tokens — light (default)
    ───────────────────────────────────────────── */
    :root {
      --sidebar-w:        260px;
      --sidebar-w-col:     56px;
      --topbar-h:          52px;

      --clr-sidebar-bg:    #ffffff;
      --clr-sidebar-bdr:   #e8eaed;
      --clr-active-bg:     #e8f4fd;
      --clr-active-accent: #1976d2;
      --clr-hover-bg:      #f5f7fa;
      --clr-bg-main:       #f4f5f7;
      --clr-bg-surface:    #ffffff;
      --clr-bg-input:      #f5f7fa;
      --clr-text-1:        #111827;
      --clr-text-2:        #4b5563;
      --clr-text-3:        #9ca3af;
      --clr-scrollbar:     #e0e0e0;
      --clr-tooltip-bg:    #1f2937;
      --clr-tooltip-fg:    #f9fafb;
      --clr-backdrop:      rgba(0,0,0,0.35);
      --shadow-sidebar:    4px 0 20px rgba(0,0,0,0.12);
      --shadow-card:       0 1px 4px rgba(0,0,0,0.08);
    }

    /* ─────────────────────────────────────────────
       Design tokens — dark
    ───────────────────────────────────────────── */
    html.dark {
      --clr-sidebar-bg:    #1c1c28;
      --clr-sidebar-bdr:   #2a2a3c;
      --clr-active-bg:     #17244a;
      --clr-active-accent: #4dabf7;
      --clr-hover-bg:      #25253a;
      --clr-bg-main:       #13131f;
      --clr-bg-surface:    #1c1c28;
      --clr-bg-input:      #25253a;
      --clr-text-1:        #e5e7eb;
      --clr-text-2:        #9ca3af;
      --clr-text-3:        #6b7280;
      --clr-scrollbar:     #36364e;
      --clr-tooltip-bg:    #e5e7eb;
      --clr-tooltip-fg:    #1c1c28;
      --clr-backdrop:      rgba(0,0,0,0.55);
      --shadow-sidebar:    4px 0 20px rgba(0,0,0,0.45);
      --shadow-card:       0 1px 6px rgba(0,0,0,0.35);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%; margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--clr-bg-main);
      color: var(--clr-text-1);
    }

    /* ─── Layout Shell ─── */
    #app { display: flex; height: 100%; overflow: hidden; }

    /* ─── Sidebar ─── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      height: 100%;
      background: var(--clr-sidebar-bg);
      border-right: 1px solid var(--clr-sidebar-bdr);
      display: flex;
      flex-direction: column;
      transition: width .22s ease, min-width .22s ease;
      overflow: hidden;
      z-index: 100;
      flex-shrink: 0;
    }
    #sidebar.collapsed { width: var(--sidebar-w-col); min-width: var(--sidebar-w-col); }

    /* Brand */
    .s-brand {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; height: 60px; flex-shrink: 0;
      border-bottom: 1px solid var(--clr-sidebar-bdr);
    }
    .s-brand-inner { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .s-logo {
      width: 32px; height: 32px; border-radius: 8px; background: #1976d2;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 15px; font-weight: 800; flex-shrink: 0;
    }
    .s-brand-name {
      font-size: 16px; font-weight: 700; color: var(--clr-text-1);
      white-space: nowrap; letter-spacing: -.2px;
    }
    .collapsed .s-brand-name { display: none; }
    .s-toggle {
      background: none; border: none; cursor: pointer; padding: 6px;
      border-radius: 6px; color: var(--clr-text-2); font-size: 15px; line-height: 1;
      transition: background .15s; flex-shrink: 0;
    }
    .s-toggle:hover { background: var(--clr-hover-bg); }
    .collapsed .s-toggle { margin: 0 auto; }

    /* Search */
    .s-search { padding: 10px 12px; flex-shrink: 0; }
    .s-search-box {
      display: flex; align-items: center; gap: 8px; padding: 7px 11px;
      background: var(--clr-bg-input); border: 1px solid var(--clr-sidebar-bdr);
      border-radius: 8px; font-size: 13px; color: var(--clr-text-3);
      transition: border-color .15s;
    }
    .s-search-box:focus-within { border-color: var(--clr-active-accent); }
    .s-search-box input {
      border: none; outline: none; background: transparent;
      color: var(--clr-text-1); font-size: 13px; flex: 1; min-width: 0;
    }
    .s-search-box input::placeholder { color: var(--clr-text-3); }
    .collapsed .s-search { padding: 10px 8px; }
    .collapsed .s-search-box { justify-content: center; padding: 7px; }
    .collapsed .s-search-box input { display: none; }

    /* ─── Module separator label ─── */
    .s-section {
      padding: 18px 16px 4px;
      font-size: 10px; font-weight: 600; letter-spacing: .8px;
      text-transform: uppercase; color: var(--clr-text-3);
      flex-shrink: 0;
    }
    .collapsed .s-section { display: none; }

    /* Menu scroll area */
    .s-menu { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 0 12px; }
    .s-menu::-webkit-scrollbar { width: 3px; }
    .s-menu::-webkit-scrollbar-thumb { background: var(--clr-scrollbar); border-radius: 3px; }

    /* Group */
    .m-group { }
    .m-group-hdr {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; cursor: pointer; user-select: none;
      transition: background .15s; -webkit-tap-highlight-color: transparent;
    }
    .m-group-hdr:hover { background: var(--clr-hover-bg); }
    .m-group-icon {
      width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--clr-text-2);
      transition: background .15s, color .15s;
    }
    .m-group.active > .m-group-hdr .m-group-icon,
    .m-group-hdr:hover .m-group-icon { color: var(--clr-active-accent); }
    .m-group-label { flex: 1; font-size: 13.5px; font-weight: 600; color: var(--clr-text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .m-group-chevron { font-size: 10px; color: var(--clr-text-3); transition: transform .2s; flex-shrink: 0; }
    .m-group.open .m-group-chevron { transform: rotate(180deg); }

    .collapsed .m-group-label, .collapsed .m-group-chevron { display: none; }
    .collapsed .m-group-hdr { justify-content: center; padding: 9px 0; }

    /* Group items */
    .m-group-items { max-height: 0; overflow: hidden; transition: max-height .22s ease; }
    .m-group.open .m-group-items { max-height: 1200px; }
    .collapsed .m-group-items { max-height: 0 !important; }

    /* Nav item */
    .m-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px 8px 50px;
      font-size: 13.5px; color: var(--clr-text-2); text-decoration: none;
      border-left: 3px solid transparent;
      transition: background .15s, color .15s;
      cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      -webkit-tap-highlight-color: transparent;
    }
    .m-item:hover { background: var(--clr-hover-bg); color: var(--clr-text-1); }
    .m-item.active {
      background: var(--clr-active-bg); color: var(--clr-active-accent);
      border-left-color: var(--clr-active-accent); font-weight: 500;
    }

    /* Top-level standalone item */
    .m-item.top { padding-left: 14px; }
    .m-item .m-item-icon { width: 26px; height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .m-item .m-item-label { overflow: hidden; text-overflow: ellipsis; }
    .collapsed .m-item.top { justify-content: center; padding: 9px 0; }
    .collapsed .m-item .m-item-label { display: none; }

    /* Collapsed tooltips */
    .collapsed .m-item[title]:hover::after,
    .collapsed .m-group-hdr[title]:hover::after {
      content: attr(title);
      position: absolute; left: calc(var(--sidebar-w-col) + 10px); top: 50%;
      transform: translateY(-50%);
      background: var(--clr-tooltip-bg); color: var(--clr-tooltip-fg);
      padding: 5px 10px; border-radius: 6px; font-size: 12px;
      white-space: nowrap; z-index: 9999; pointer-events: none;
    }
    .collapsed .m-item, .collapsed .m-group-hdr { position: relative; }

    /* ─── Main ─── */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }

    /* ─── Topbar ─── */
    #topbar {
      height: var(--topbar-h); background: var(--clr-bg-surface);
      border-bottom: 1px solid var(--clr-sidebar-bdr);
      display: flex; align-items: center; padding: 0 20px; flex-shrink: 0; gap: 12px;
    }
    .topbar-hamburger {
      display: none; background: none; border: none; cursor: pointer;
      color: var(--clr-text-2); font-size: 18px; padding: 6px; border-radius: 6px; line-height: 1;
    }
    .topbar-mobile-brand {
      display: none; align-items: center; gap: 8px;
      font-weight: 700; font-size: 15px; color: var(--clr-text-1);
    }
    .topbar-mobile-brand .s-logo { width: 26px; height: 26px; font-size: 12px; }

    #breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--clr-text-2); }
    .bc-sep { color: var(--clr-text-3); font-size: 10px; }
    .bc-cur { color: var(--clr-text-1); font-weight: 500; }

    .topbar-gap { flex: 1; }

    /* Env badge */
    .env-badge {
      font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
      letter-spacing: .4px; text-transform: uppercase; flex-shrink: 0;
      background: #1976d2; color: #fff;
    }

    /* Theme toggle */
    .theme-btn {
      background: none; border: 1px solid var(--clr-sidebar-bdr);
      color: var(--clr-text-2); cursor: pointer; padding: 6px 10px; border-radius: 8px;
      font-size: 13px; display: flex; align-items: center; gap: 6px;
      transition: background .15s, border-color .15s;
    }
    .theme-btn:hover { background: var(--clr-hover-bg); border-color: var(--clr-text-2); }
    .theme-btn .lbl { font-size: 11.5px; font-weight: 500; }

    /* ─── Content ─── */
    #content { flex: 1; overflow: auto; padding: 24px; }

    .state-loading {
      display: flex; align-items: center; justify-content: center;
      height: 240px; color: var(--clr-text-3); font-size: 14px; gap: 10px;
    }

    .state-error {
      padding: 60px 20px; text-align: center;
    }
    .state-error h2 { font-size: 20px; margin: 0 0 8px; color: #ef4444; }
    .state-error p { color: var(--clr-text-2); margin: 0 0 16px; font-size: 14px; }
    .state-error a { color: var(--clr-active-accent); text-decoration: none; font-size: 14px; }

    /* ─── Footer ─── */
    #footer {
      background: var(--clr-bg-surface); border-top: 1px solid var(--clr-sidebar-bdr);
      padding: 12px 20px; font-size: 11.5px; color: var(--clr-text-3); text-align: center;
      flex-shrink: 0;
    }

    /* ─── Backdrop ─── */
    #backdrop {
      display: none; position: fixed; inset: 0;
      background: var(--clr-backdrop); z-index: 99;
    }
    #backdrop.on { display: block; }

    /* ─── Mobile ─── */
    @media (max-width: 767px) {
      #sidebar {
        position: fixed; left: 0; top: 0; height: 100%;
        transform: translateX(-100%); transition: transform .22s ease;
      }
      #sidebar.mobile-open { transform: translateX(0); box-shadow: var(--shadow-sidebar); }
      #sidebar.collapsed { width: var(--sidebar-w); min-width: var(--sidebar-w); }
      .collapsed .s-brand-name, .collapsed .m-group-label, .collapsed .m-group-chevron,
      .collapsed .m-item .m-item-label { display: unset; }
      .collapsed .m-group-items { max-height: unset !important; }
      .collapsed .m-group.open .m-group-items { max-height: 1200px !important; }
      .collapsed .m-group:not(.open) .m-group-items { max-height: 0 !important; }
      .collapsed .m-group-hdr, .collapsed .m-item.top { justify-content: flex-start; padding-left: 14px; }
      .collapsed .m-item { padding-left: 50px; }
      .topbar-hamburger { display: block; }
      .topbar-mobile-brand { display: flex; }
      .theme-btn .lbl { display: none; }
      #content { padding: 16px; }
    }

    /* ═══════════════════════════════════════════════
       AMIS SDK Dark Mode — CSS custom property overrides.
       AMIS components consume these at render time.
       Approach: invert the neutral fill/text/line scales
       (scale 1 = darkest, 11 = lightest in light mode;
        we swap so 11 = darkest = our surface colour).
    ═══════════════════════════════════════════════ */
    html.dark {
      --colors-neutral-fill-11: #1c1c28;
      --colors-neutral-fill-10: #25253a;
      --colors-neutral-fill-9:  #2a2a3c;
      --colors-neutral-fill-8:  #32324a;
      --colors-neutral-fill-7:  #3b3b55;
      --colors-neutral-fill-6:  #4e4e6a;
      --colors-neutral-fill-5:  #64648a;
      --colors-neutral-fill-4:  #8888a8;
      --colors-neutral-fill-3:  #aaaacc;
      --colors-neutral-fill-2:  #ccccdd;
      --colors-neutral-fill-1:  #e5e7eb;
      --colors-neutral-fill-12: #17244a;

      --colors-neutral-text-2:  #e5e7eb;
      --colors-neutral-text-1:  #f3f4f6;
      --colors-neutral-text-3:  #d1d5db;
      --colors-neutral-text-4:  #aaaacc;
      --colors-neutral-text-5:  #8888a8;
      --colors-neutral-text-6:  #64648a;

      --colors-neutral-line-8:  #32324a;
      --colors-neutral-line-7:  #3b3b55;
      --colors-neutral-line-6:  #4e4e6a;

      --background:               #13131f;
      --body-bg:                  #13131f;
      --body-color:               #e5e7eb;
      --text-color:               #e5e7eb;
      --white:                    #1c1c28;
      --light:                    #25253a;

      --Page-main-bg:             #13131f;
      --Panel-bg-color:           #1c1c28;
      --Panel-heading-bg-color:   #1c1c28;
      --Panel-footer-bg-color:    #1c1c28;

      --Table-bg:                 #1c1c28;
      --Table-thead-bg:           #25253a;
      --Table-strip-bg:           #191927;
      --Table-onHover-bg:         #25253a;
      --Table-heading-bg:         #1c1c28;

      --Card-bg:                  #1c1c28;
      --Modal-bg:                 #1c1c28;
      --Drawer-bg:                #1c1c28;
      --Drawer-header-bg:         #1c1c28;
      --Drawer-overlay-bg:        rgba(0,0,0,0.6);
      --Tabs-content-bg:          #1c1c28;
      --Collapse-header-bg:       #1c1c28;
      --Collapse-header-onHover-bg: #25253a;

      --Form-input-bg:            #25253a;
      --Form-input-borderColor:   #2a2a3c;
      --Form-input-onFocus-bg:    #25253a;
      --Form-input-onFocus-borderColor: #4dabf7;

      --Select-input-bg:          #25253a;
      --Select-menu-bg:           #1c1c28;
      --Select-option-bg:         #1c1c28;
      --Select-option-onHover-bg: #25253a;
      --Select-option-onActive-bg:#17244a;

      --DropDown-menu-bg:         #1c1c28;
      --DropDown-menu-borderColor:#2a2a3c;
      --DropDown-menuItem-onHover-bg: #25253a;

      --DatePicker-bg:            #1c1c28;
      --DatePicker-cell-bg:       #25253a;
      --DatePicker-onHover-bg:    #2a2a3c;
      --DatePicker-onActive-bg:   #17244a;

      --PopOver-bg:               #1c1c28;
      --PopOver-borderColor:      #2a2a3c;
      --Tooltip-bg:               #2a2a3c;
      --Tooltip-color:            #e5e7eb;

      --borderColor:              #2a2a3c;
      --boxShadow:                0 2px 12px rgba(0,0,0,0.5);

      --table-header-bg-color:    #25253a;
      --table-body-bg-color:      #1c1c28;
      --table-body-hover-bg-color:#25253a;

      --conditionBuilder-body-bg-color: #1c1c28;
      --Fieldset-legend-bgColor:  #1c1c28;
    }

    html.dark body, html.dark #content { background: var(--clr-bg-main) !important; }

    /* Portal containers appended to <body> — cascade from html.dark */
    html.dark .cxd-PopOver,
    html.dark .cxd-PopOverAble-popover { background: var(--PopOver-bg); border-color: var(--PopOver-borderColor); color: var(--text-color); }
    html.dark .cxd-DropDown-menu { background: var(--DropDown-menu-bg); border-color: var(--DropDown-menu-borderColor); }
    html.dark .cxd-DropDown-menuItem:hover { background: var(--DropDown-menuItem-onHover-bg); }
    html.dark .cxd-Modal-content { background: var(--Modal-bg); color: var(--text-color); }
    html.dark .cxd-Drawer-content { background: var(--Drawer-bg); color: var(--text-color); }
    html.dark .cxd-Select-menu { background: var(--Select-menu-bg); color: var(--text-color); }
    html.dark .cxd-Select-option:hover { background: var(--Select-option-onHover-bg); }
    html.dark .cxd-Select-option.is-active { background: var(--Select-option-onActive-bg); }
    html.dark .cxd-Tooltip-body { background: var(--Tooltip-bg); color: var(--Tooltip-color); }
    html.dark #content::-webkit-scrollbar-thumb { background: #36364e; }
    html.dark #content::-webkit-scrollbar-track { background: #13131f; }
  </style>
</head>

<body>
<div id="app">

  <!-- ── Sidebar ── -->
  <aside id="sidebar">
    <div class="s-brand">
      <div class="s-brand-inner">
        <div class="s-logo">A</div>
        <span class="s-brand-name">AWO ERP</span>
      </div>
      <button class="s-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
        <i class="fa fa-bars"></i>
      </button>
    </div>

    <div class="s-search">
      <div class="s-search-box">
        <i class="fa fa-search" style="font-size:12px"></i>
        <input id="navSearch" type="search" placeholder="Search…" autocomplete="off">
      </div>
    </div>

    <nav class="s-menu" id="navMenu"></nav>
  </aside>

  <div id="backdrop" onclick="closeMobileSidebar()"></div>

  <!-- ── Main ── -->
  <div id="main">
    <div id="topbar">
      <button class="topbar-hamburger" onclick="openMobileSidebar()" aria-label="Menu">
        <i class="fa fa-bars"></i>
      </button>
      <div class="topbar-mobile-brand">
        <div class="s-logo">A</div>
        <span>AWO ERP</span>
      </div>
      <div id="breadcrumb"><span class="bc-cur">Dashboard</span></div>
      <div class="topbar-gap"></div>
      <span class="env-badge">SDUI</span>
      <button class="theme-btn" onclick="cycleTheme()" aria-label="Toggle theme">
        <i id="themeIcon" class="fa fa-circle-half-stroke"></i>
        <span class="lbl" id="themeLabel">System</span>
      </button>
    </div>

    <div id="content">
      <div class="state-loading"><i class="fa fa-spinner fa-spin"></i> Loading…</div>
    </div>

    <div id="footer">
      &copy; 2026 AWO ERP &middot; SDUI platform &middot; schemas compiled by Go pipeline at <code>/schema/*</code>
    </div>
  </div>
</div>

<!-- AMIS SDK -->
<script src="/sdk/sdk.js"></script>
<script src="/sdk/charts.js"></script>

<script>
(function () {
  'use strict';

  var amis = amisRequire('amis/embed');
  var currentInstance = null;

  /* ─── Theme ─── */
  var THEMES = ['system', 'light', 'dark'];
  var THEME_ICONS  = { system: 'fa-circle-half-stroke', light: 'fa-sun', dark: 'fa-moon' };
  var THEME_LABELS = { system: 'System', light: 'Light', dark: 'Dark' };
  var mq = window.matchMedia('(prefers-color-scheme: dark)');

  function savedTheme() {
    try { return localStorage.getItem('awo-theme') || 'system'; } catch(e) { return 'system'; }
  }

  function isDark(t) {
    return t === 'dark' || (t === 'system' && mq.matches);
  }

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var dark = isDark(t);
    document.documentElement.classList.toggle('dark', dark);
    document.body.classList.toggle('dark', dark);
    document.body.classList.toggle('amis-theme-dark', dark);
    var icon  = document.getElementById('themeIcon');
    var label = document.getElementById('themeLabel');
    if (icon)  icon.className = 'fa ' + THEME_ICONS[t];
    if (label) label.textContent = THEME_LABELS[t];
    try { localStorage.setItem('awo-theme', t); } catch(e) {}
  }

  window.cycleTheme = function () {
    var t = savedTheme();
    applyTheme(THEMES[(THEMES.indexOf(t) + 1) % THEMES.length]);
  };
  mq.addEventListener('change', function () {
    if (savedTheme() === 'system') applyTheme('system');
  });
  applyTheme(savedTheme());

  /* ─── Navigation config
     Hardcoded to match exactly what register.go + blank imports register.
     Routes without a registered screen show a "not yet implemented" page.
  ─── */
  var NAV = [
    {
      type: 'item',
      id: 'dashboard',
      label: 'Dashboard',
      icon: 'fa-gauge-high',
      route: 'dashboard'
    },
    {
      type: 'group',
      id: 'finance',
      label: 'Finance',

  /* ─── Render sidebar ─── */
  function renderNav(filter) {
    var q = (filter || '').trim().toLowerCase();
    var html = '';

    NAV.forEach(function (entry) {
      if (entry.type === 'item') {
        if (q && entry.label.toLowerCase().indexOf(q) < 0) return;
        html += navItem(entry, true);
      } else {
        var items = entry.items.filter(function (it) {
          return !q || it.label.toLowerCase().indexOf(q) >= 0;
        });
        if (q && items.length === 0) return;

        var grpOpen = q ? 'open' : isGroupActive(entry.id) ? 'open' : '';

        html += '<div class="m-group ' + grpOpen + '" data-group="' + entry.id + '">';
        html += '<div class="m-group-hdr" title="' + entry.label + '" onclick="toggleGroup(\'' + entry.id + '\')">'
          + '<div class="m-group-icon"><i class="fa ' + entry.icon + '"></i></div>'
          + '<span class="m-group-label">' + entry.label + '</span>'
          + '<i class="fa fa-chevron-down m-group-chevron"></i>'
          + '</div>';
        html += '<div class="m-group-items">';
        items.forEach(function (it) { html += navItem(it, false); });
        html += '</div></div>';
      }
    });

    document.getElementById('navMenu').innerHTML = html;
    updateActiveState();
  }

  function navItem(entry, isTop) {
    var cls = 'm-item' + (isTop ? ' top' : '');
    return '<a class="' + cls + '" href="#' + entry.route + '" data-route="' + entry.route + '" title="' + entry.label + '">'
      + (entry.icon ? '<span class="m-item-icon"><i class="fa ' + entry.icon + '"></i></span>' : '')
      + '<span class="m-item-label">' + entry.label + '</span>'
      + '</a>';
  }

  function isGroupActive(groupId) {
    var route = currentRoute();
    var group = NAV.find(function (e) { return e.id === groupId; });
    if (!group || group.type !== 'group') return false;
    return group.items.some(function (it) { return route.indexOf(it.route.replace(/\/new$/, '')) === 0; });
  }

  function updateActiveState() {
    var route = currentRoute();
    document.querySelectorAll('.m-item').forEach(function (el) {
      var r = el.getAttribute('data-route') || '';
      var base = r.replace(/\/new$/, '');
      el.classList.toggle('active', r === route || (base && route.indexOf(base) === 0 && base !== ''));
    });

    // Open groups containing the active item
    document.querySelectorAll('.m-group').forEach(function (grp) {
      var id = grp.getAttribute('data-group');
      var group = NAV.find(function (e) { return e.id === id; });
      if (!group) return;
      var hasActive = group.items && group.items.some(function (it) {
        var base = it.route.replace(/\/new$/, '');
        return it.route === route || (base && route.indexOf(base) === 0);
      });
      if (hasActive) grp.classList.add('open');
    });
  }

  /* ─── AMIS environment ─── */
  var amisEnv = {
    locale: 'en-US',

    // Forward all AMIS API calls to the real backend.
    // Converts AMIS pagination (page/perPage) to backend (offset/limit).
    // Unwraps backend envelope {success, data, meta} → AMIS {status, data}.
    fetcher: function (api) {
      var url = api.url;
      try {
        var u = new URL(url, window.location.origin);
        var page    = u.searchParams.get('page');
        var perPage = u.searchParams.get('perPage');
        if (page !== null) {
          var limit = perPage ? parseInt(perPage, 10) : 20;
          u.searchParams.delete('page');
          u.searchParams.set('offset', String((parseInt(page, 10) - 1) * limit));
        }
        if (perPage !== null) {
          u.searchParams.delete('perPage');
          u.searchParams.set('limit', perPage);
        }
        url = u.toString();
      } catch(e) {}

      var method  = (api.method || 'get').toLowerCase();
      var headers = Object.assign({'Content-Type': 'application/json'}, api.headers || {});

      // Double-submit CSRF cookie for state-changing requests
      if (method !== 'get' && method !== 'head' && method !== 'options') {
        var csrf = document.cookie.split('; ').reduce(function (v, p) {
          var kv = p.split('='); return kv[0] === 'csrf_token' ? decodeURIComponent(kv[1]) : v;
        }, '');
        if (csrf) headers['X-Csrf-Token'] = csrf;
      }

      var opts = { method: method, headers: headers };
      if (method !== 'get' && method !== 'head' && api.data) {
        opts.body = JSON.stringify(api.data);
      }

      return fetch(url, opts)
        .catch(function () {
          // Network error (python server, no API routes) — return empty success
          return { ok: false, status: 0, _netErr: true };
        })
        .then(function (res) {
          if (res._netErr) return { status: 0, data: { items: [], count: 0 }, msg: 'Demo mode — no live API' };
          if (res.status === 204) return { status: 0, msg: '' };
          if (res.status === 401) {
            window.location.href = '/ui/login?next=' + encodeURIComponent(window.location.hash);
            return Promise.reject(new Error('unauthenticated'));
          }
          if (!res.ok) {
            return res.json().catch(function () { return {}; }).then(function (b) {
              return { status: 0, data: { items: [], count: 0 }, msg: b.message || b.msg || 'Demo mode — no live API' };
            });
          }
          return res.json();
        })
        .then(function (json) {
          // Already AMIS format
          if (json.status !== undefined && json.success === undefined) return json;
          // Backend envelope
          if (json.success !== undefined) {
            if (!json.success) return { status: 1, msg: json.message || 'Request failed' };
            if (Array.isArray(json.data) && json.meta && json.meta.pagination) {
              return { status: 0, data: { items: json.data, count: json.meta.pagination.total_records } };
            }
            return { status: 0, data: json.data, msg: '' };
          }
          return json;
        })
        .catch(function (err) {
          return { status: 1, msg: 'Network error: ' + (err.message || err) };
        });
    },

    // Internal route links use hash routing — no full-page reload
    jumpTo: function (to) {
      var route = (to || '').replace(/^#/, '').replace(/^\//, '');

  /* ─── Navigate: try Go pipeline, fall back to embedded demo schemas ─── */
  function navigate() {
    var route   = currentRoute();
    var content = document.getElementById('content');

    updateBreadcrumb(route);
    updateActiveState();
    closeMobileSidebar();

    // Collapse sidebar on navigation (desktop)
    if (window.innerWidth >= 768) {
      document.getElementById('sidebar').classList.add('collapsed');
    }

    // Destroy previous AMIS instance
    if (currentInstance && currentInstance.unmount) {
      try { currentInstance.unmount(); } catch(e) {}
      currentInstance = null;
    }
    content.innerHTML = '<div class="state-loading"><i class="fa fa-spinner fa-spin"></i>&nbsp;Loading schema…</div>';

    // Try real pipeline first (Go server). On 4xx/5xx/network error → embedded demo.
    fetch('/schema/' + route, { headers: { Accept: 'application/json' } })
      .then(function (res) {
        if (res.status === 401 || res.status === 403) {
          window.location.href = '/ui/login?next=' + encodeURIComponent(window.location.hash);
          return null;
        }
        if (!res.ok) {
          // Pipeline unavailable — use embedded demo schema
          return { status: 0, data: DEMO_SCHEMAS[route] || demoPlaceholder(route), _demo: true };
        }
        return res.json();
      })
      .then(function (envelope) {
        if (!envelope) return; // auth redirect in progress
        if (envelope.status === 401 || envelope.error === true) {
          window.location.href = '/ui/login?next=' + encodeURIComponent(window.location.hash);
          return;
        }
        var schema = (envelope.status === 0 && envelope.data) ? envelope.data : envelope;
        content.innerHTML = '';
        currentInstance = amis.embed(content, schema, { locale: 'en-US' }, amisEnv);
      })
      .catch(function () {
        // Network error (e.g. python server, no /schema/ route) → demo fallback
        var schema = DEMO_SCHEMAS[route] || demoPlaceholder(route);
        content.innerHTML = '';
        currentInstance = amis.embed(content, schema, { locale: 'en-US' }, amisEnv);
      });
  }

  /* ─── Search filter ─── */
  document.getElementById('navSearch').addEventListener('input', function () {
    renderNav(this.value);
  });

  /* ─── Init ─── */
  renderNav();
  window.addEventListener('hashchange', function () { renderNav(document.getElementById('navSearch').value); navigate(); });

  if (!window.location.hash) {
    window.location.hash = '#dashboard';
  } else {
    navigate();
  }
})();
</script>
</body>
</html>
