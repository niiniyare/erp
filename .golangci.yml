linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - revive
    - misspell

linters-settings:
  lll:
    line-length: 120
  revive:
    rules:
      - name: argument-limit
        arguments: [4]
      - name: cognitive-complexity
        arguments: [10]

output:
  formats:
    - format: colored-line-number

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default-severity: error
