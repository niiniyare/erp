name: IAM TDD Pipeline

on:
  push:
    branches: [ main, iam ]
    paths:
      - 'internal/core/iam/**'
      - 'docs/module/user/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'internal/core/iam/**'
      - 'docs/module/user/**'

env:
  GO_VERSION: '1.21'
  
jobs:
  # Gate 1: Code Quality
  lint:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.54.2
          
      - name: Run golangci-lint
        run: |
          golangci-lint run ./internal/core/iam/... --timeout=5m
          
      - name: Run go vet
        run: |
          go vet ./internal/core/iam/...
          
      - name: Check for TODO/FIXME in changed code
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '\.(go)$' | xargs grep -n 'TODO\|FIXME' || true; then
            echo "Found TODO/FIXME in changed code. Please resolve before merging."
            exit 1
          fi
          
      - name: Verify test files exist
        run: |
          # Check that every .go file has a corresponding _test.go file
          find ./internal/core/iam -name "*.go" -not -name "*_test.go" -not -name "*_mock.go" | while read file; do
            test_file="${file%.*}_test.go"
            if [ ! -f "$test_file" ]; then
              echo "Missing test file: $test_file"
              exit 1
            fi
          done

  # Gate 2: Unit Tests
  unit-tests:
    name: Unit Tests Gate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Run Unit Tests with Coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./internal/core/iam/...
          
      - name: Generate Coverage Report
        run: |
          go tool cover -html=coverage.out -o coverage.html
          
      - name: Check Coverage Thresholds
        run: |
          # Check per-package coverage thresholds
          echo "Checking coverage thresholds..."
          
          # Authentication paths: ≥90%
          authn_coverage=$(go tool cover -func=coverage.out | grep "internal/core/iam/authn" | tail -1 | awk '{print $3}' | sed 's/%//')
          if (( $(echo "$authn_coverage < 90" | bc -l) )); then
            echo "Authentication coverage ($authn_coverage%) below threshold (90%)"
            exit 1
          fi
          
          # Policy evaluation: ≥90%
          policy_coverage=$(go tool cover -func=coverage.out | grep "internal/core/iam/policy" | tail -1 | awk '{print $3}' | sed 's/%//')
          if (( $(echo "$policy_coverage < 90" | bc -l) )); then
            echo "Policy coverage ($policy_coverage%) below threshold (90%)"
            exit 1
          fi
          
          # Other packages: ≥85%
          total_coverage=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          if (( $(echo "$total_coverage < 85" | bc -l) )); then
            echo "Total coverage ($total_coverage%) below threshold (85%)"
            exit 1
          fi
          
          echo "All coverage thresholds met:"
          echo "- Authentication: ${authn_coverage}% (≥90%)"
          echo "- Policy: ${policy_coverage}% (≥90%)"
          echo "- Total: ${total_coverage}% (≥85%)"
          
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.html

  # Gate 3: Integration Tests
  integration-tests:
    name: Integration Tests Gate
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_iam
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
          
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_iam?sslmode=disable
        run: |
          # Run database migrations for testing
          make migrateup
          
      - name: Run Integration Tests
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_iam?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: |
          go test -tags=integration -timeout=10m ./internal/core/iam/...
          
      - name: Test Multi-tenant Isolation
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_iam?sslmode=disable
        run: |
          go test -tags=isolation -run=TestTenant ./internal/core/iam/...

  # Gate 4: Contract & Property Tests
  contract-tests:
    name: Contract & Property Tests Gate
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Run Contract Tests
        run: |
          go test -tags=contract -timeout=15m ./internal/core/iam/...
          
      - name: Run Property Tests
        run: |
          go test -tags=property -timeout=15m ./internal/core/iam/...
          
      - name: Verify Determinism
        run: |
          # Run determinism tests multiple times
          for i in {1..5}; do
            echo "Determinism test run $i"
            go test -tags=determinism ./internal/core/iam/...
          done

  # Gate 5: Performance & Load Tests
  performance-tests:
    name: Performance & Load Tests Gate
    runs-on: ubuntu-latest
    needs: contract-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_iam
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
          
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Run Performance Benchmarks
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_iam?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: |
          go test -bench=. -benchmem -timeout=30m ./internal/core/iam/...
          
      - name: Run Load Tests
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_iam?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: |
          go test -tags=load -timeout=30m ./internal/core/iam/...
          
      - name: Verify Performance Requirements
        run: |
          # Run specific performance requirement tests
          # Permission evaluation: 99th percentile < 50ms
          # Authentication: < 10ms with cache hit
          # Database queries: 95th percentile < 100ms
          go test -tags=performance -timeout=20m ./internal/core/iam/...

  # Gate 6: Security & Chaos Tests
  security-tests:
    name: Security & Chaos Tests Gate
    runs-on: ubuntu-latest
    needs: performance-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Run Security Tests
        run: |
          go test -tags=security -timeout=20m ./internal/core/iam/...
          
      - name: Run Chaos Engineering Tests
        run: |
          go test -tags=chaos -timeout=25m ./internal/core/iam/...
          
      - name: Run Boundary Tests
        run: |
          go test -tags=boundary -timeout=15m ./internal/core/iam/...

  # Artifacts and Reporting
  artifacts:
    name: Generate Artifacts
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, contract-tests]
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Download Coverage Report
        uses: actions/download-artifact@v3
        with:
          name: coverage-report
          
      - name: Generate Traceability Matrix
        run: |
          # Generate traceability matrix from test cases and implementation
          go run ./scripts/generate-traceability-matrix.go > traceability-matrix.json
          
      - name: Upload Traceability Matrix
        uses: actions/upload-artifact@v3
        with:
          name: traceability-matrix
          path: traceability-matrix.json
          
      - name: Generate Test Report
        run: |
          # Generate test report
          echo "# IAM TDD Test Report" > test-report.md
          echo "Generated on: $(date)" >> test-report.md
          echo "" >> test-report.md
          echo "## Test Results Summary" >> test-report.md
          # Add test results summary
          
      - name: Upload Test Report
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: test-report.md

  # Status Check for Protected Branch
  status-check:
    name: Required Status Check
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, contract-tests]
    if: always()
    steps:
      - name: Check All Gates Passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || 
                "${{ needs.unit-tests.result }}" != "success" || 
                "${{ needs.integration-tests.result }}" != "success" || 
                "${{ needs.contract-tests.result }}" != "success" ]]; then
            echo "One or more required gates failed"
            exit 1
          fi
          echo "All required gates passed successfully"