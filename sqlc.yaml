version: "2"
sql:
- schema: "db/migration"
  queries: "db/queries"
  engine: "postgresql"
  gen:
    go: 
      package: "db"
      out: "db/sqlc"
      sql_package: "pgx/v5"
      emit_json_tags: true
      emit_interface: true
      emit_pointers_for_null_types: true
      emit_empty_slices: true
      initialisms: ["id"]
      emit_sql_as_comment: true
      omit_unused_structs: true  
      emit_prepared_queries: true
      emit_enum_valid_method: true
      emit_all_enum_values: true
      overrides:
        # - db_type: "timestamptz"
          # go_type: "time.Time"
        - db_type: "uuid"
          go_type: "github.com/google/uuid.UUID"
