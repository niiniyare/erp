site_name: Awo ERP Documentation
repo_url: https://awo
edit_uri: ""
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  highlightjs: true
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: indigo
      accent: indigo
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: indigo
      accent: indigo

  excluded_docs:
    - './reference/*'
    - .'/09-reference/*'

plugins:
  - search:
      lang: en
      separator: '[\s\-,.]+'
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  - javascripts/mermaid-config.js
  - javascripts/search-enhancements.js
  - javascripts/search-analytics.js
copyright: Copyright &copy; 2024 Awo ERP
