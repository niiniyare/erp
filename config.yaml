# ============================================================
# AwoERP — Application Configuration
# ============================================================
#
# Config priority (highest → lowest):
#   1. Environment variables  (see "Env:" comments on each field)
#   2. This file
#   3. Built-in code defaults
#
# To override any value at runtime, set the corresponding
# environment variable — no file change needed.
# ============================================================

# ── Application ──────────────────────────────────────────────────────────────
app:
  name: "AwoERP"       # Env: APP_NAME
  version: "0.1.0"     # Env: APP_VERSION
  # Env: APP_STAGE — allowed values: dev | staging | production | testing
  # Controls stage-based defaults (log level, dev mode, etc.)
  stage: "dev"
  # Env: APP_DEBUG / DEBUG — when true forces log level to debug
  debug: true
  environment: "local"   # Env: APP_ENV / ENVIRONMENT
  namespace: "default"   # Env: APP_NAMESPACE / NAMESPACE

# ── HTTP / gRPC Server ───────────────────────────────────────────────────────
server:
  host: "0.0.0.0"       # Env: SERVER_HOST
  port: "8080"          # Env: SERVER_PORT
  grpc_port: "9090"     # Env: GRPC_PORT
  read_timeout: "30s"   # Env: SERVER_READ_TIMEOUT
  write_timeout: "30s"  # Env: SERVER_WRITE_TIMEOUT
  idle_timeout: "60s"   # Env: SERVER_IDLE_TIMEOUT

# ── PostgreSQL ───────────────────────────────────────────────────────────────
database:
  host: "localhost"        # Env: DB_HOST
  port: 5432               # Env: DB_PORT
  user: "admin"            # Env: DB_USER
  password: "admin"        # Env: DB_PASSWORD  — use env var in production
  database: "ledger"       # Env: DB_NAME
  # Env: DB_SSL_MODE — disable | require | verify-ca | verify-full
  ssl_mode: "disable"
  max_open_conns: 100      # Env: DB_MAX_OPEN_CONNS
  max_idle_conns: 10       # Env: DB_MAX_IDLE_CONNS
  conn_max_lifetime: "10m" # Env: DB_CONN_MAX_LIFETIME

# ── Database Migrations ──────────────────────────────────────────────────────
migration:
  # Path to migration SQL files — relative to the working directory
  url: "file://db/migration"

# ── Redis ────────────────────────────────────────────────────────────────────
redis:
  host: "localhost"  # Env: REDIS_HOST
  port: 6379         # Env: REDIS_PORT
  password: ""       # Env: REDIS_PASSWORD
  db: 0              # Env: REDIS_DB

# ── Authentication ───────────────────────────────────────────────────────────
auth:
  # FIXME: jwt_secret will be removed once the session-token migration is complete.
  # The system now uses opaque tokens stored in user_sessions, not JWTs.
  jwt_secret: "secret-key"      # Env: JWT_SECRET  — MUST use env var in production
  max_failed_attempts: 5        # Env: AUTH_MAX_FAILED_ATTEMPTS
  lockout_duration: "15m"       # Env: AUTH_LOCKOUT_DURATION
  session_ttl: "8h"             # Env: AUTH_SESSION_TTL
  cookie_name: "session"        # Env: AUTH_COOKIE_NAME
  # Env: AUTH_REQUIRE_HTTPS — set to true in staging/production
  require_https: false

# ── Logger ───────────────────────────────────────────────────────────────────
logger:
  # Env: LOG_TYPE — zerolog | zap | slog
  type: "zap"
  # Env: LOG_LEVEL — debug | info | warn | error | fatal
  # This value is always used as-is; it is NOT overridden by app.debug.
  level: "debug"
  # Env: LOG_FORMAT — json | text | console
  format: "json"
  # Env: LOG_DEV — enables development-mode features (pretty output, stack traces)
  development: true
  service_name: "AwoERP"  # Env: SERVICE_NAME
  version: "1.0.0"        # Env: SERVICE_VERSION
  # Env: LOG_OUTPUT — stdout | stderr | /absolute/path/to/file
  output: "stdout"

# ── OpenTelemetry Tracing ────────────────────────────────────────────────────
tracing:
  enabled: false              # Env: TRACING_ENABLED
  # Env: TRACING_EXPORTER — stdout | otlp | jaeger
  exporter: "stdout"
  # Env: TRACING_PROTOCOL — stdout | grpc | http
  protocol: "stdout"
  endpoint: "localhost:4317"  # Env: OTEL_ENDPOINT
  insecure: true              # Env: OTEL_INSECURE
  sampling_ratio: 1.0         # Env: TRACING_SAMPLING_RATIO  (0.0–1.0)

# ── Temporal Workflow Engine ─────────────────────────────────────────────────
temporal:
  host_port: "localhost:7233"  # Env: TEMPORAL_HOST_PORT
  namespace: "default"         # Env: TEMPORAL_NAMESPACE

  tls:
    enabled: false             # Env: TEMPORAL_TLS_ENABLED
    cert_path: ""              # Env: TEMPORAL_TLS_CERT_PATH
    key_path: ""               # Env: TEMPORAL_TLS_KEY_PATH
    ca_path: ""                # Env: TEMPORAL_TLS_CA_PATH
    server_name: ""            # Env: TEMPORAL_TLS_SERVER_NAME
    insecure_skip_verify: false # Env: TEMPORAL_TLS_INSECURE_SKIP_VERIFY

  workers:
    max_concurrent_activities: 100       # Env: TEMPORAL_MAX_CONCURRENT_ACTIVITIES
    max_concurrent_workflows: 50         # Env: TEMPORAL_MAX_CONCURRENT_WORKFLOWS
    max_concurrent_local_activities: 100 # Env: TEMPORAL_MAX_CONCURRENT_LOCAL_ACTIVITIES
    worker_stop_timeout: "30s"           # Env: TEMPORAL_WORKER_STOP_TIMEOUT
    enable_logging_in_replay: true       # Env: TEMPORAL_ENABLE_LOGGING_IN_REPLAY
    sticky_schedule_to_start_timeout: "5s"

    # System-wide task queues
    system:
      enabled: true                  # Env: TEMPORAL_SYSTEM_WORKER_ENABLED
      max_concurrent_activities: 50
      max_concurrent_workflows: 25

    notifications:
      enabled: true                  # Env: TEMPORAL_NOTIFICATIONS_WORKER_ENABLED
      max_concurrent_activities: 200
      max_concurrent_workflows: 100

    analytics:
      enabled: true                  # Env: TEMPORAL_ANALYTICS_WORKER_ENABLED
      max_concurrent_activities: 50
      max_concurrent_workflows: 25

  client:
    identity: "awo-erp"                    # Env: TEMPORAL_CLIENT_IDENTITY
    data_converter: "json"
    failure_converter: "default"
    connection_timeout: "10s"              # Env: TEMPORAL_CONNECTION_TIMEOUT
    keep_alive_time: "30s"                 # Env: TEMPORAL_KEEP_ALIVE_TIME
    keep_alive_timeout: "5s"               # Env: TEMPORAL_KEEP_ALIVE_TIMEOUT
    keep_alive_permit_without_stream: true

  metrics:
    enabled: true                              # Env: TEMPORAL_METRICS_ENABLED
    prometheus_scope: "temporal_awo_erp"       # Env: TEMPORAL_PROMETHEUS_SCOPE
    reporting_interval: "10s"                  # Env: TEMPORAL_METRICS_REPORTING_INTERVAL

  features:
    enable_workflow_shadowing: false    # Env: TEMPORAL_ENABLE_WORKFLOW_SHADOWING
    enable_session_worker: false        # Env: TEMPORAL_ENABLE_SESSION_WORKER
    enable_batch_operations: true       # Env: TEMPORAL_ENABLE_BATCH_OPERATIONS
    enable_multi_tenant_isolation: true # Env: TEMPORAL_ENABLE_MULTI_TENANT_ISOLATION

  # Per-module task queue configuration.
  # To disable a module entirely set enabled: false.
  modules:
    finance:
      enabled: true  # Env: TEMPORAL_FINANCE_MODULE_ENABLED
      task_queues:
        standard:
          enabled: true
          max_concurrent_activities: 100
          max_concurrent_workflows: 50
        high_priority:
          enabled: true
          max_concurrent_activities: 50
          max_concurrent_workflows: 25
        bulk:
          enabled: true
          max_concurrent_activities: 200
          max_concurrent_workflows: 10
        long_running:
          enabled: true
          max_concurrent_activities: 10
          max_concurrent_workflows: 5

    iam:
      enabled: true  # Env: TEMPORAL_IAM_MODULE_ENABLED
      task_queues:
        standard:
          enabled: true
          max_concurrent_activities: 50
          max_concurrent_workflows: 25
        authentication:
          enabled: true
          max_concurrent_activities: 200
          max_concurrent_workflows: 100

    feature_flag:
      enabled: true  # Env: TEMPORAL_FEATURE_FLAG_MODULE_ENABLED
      task_queues:
        standard:
          enabled: true
          max_concurrent_activities: 100
          max_concurrent_workflows: 50
        evaluation:
          enabled: true
          max_concurrent_activities: 500
          max_concurrent_workflows: 250

    audit:
      enabled: true  # Env: TEMPORAL_AUDIT_MODULE_ENABLED
      task_queues:
        standard:
          enabled: true
          max_concurrent_activities: 200
          max_concurrent_workflows: 100

    abac:
      enabled: true  # Env: TEMPORAL_ABAC_MODULE_ENABLED
      task_queues:
        standard:
          enabled: true
          max_concurrent_activities: 100
          max_concurrent_workflows: 50
        policy_evaluation:
          enabled: true
          max_concurrent_activities: 300
          max_concurrent_workflows: 150

    tenant:
      enabled: true
      task_queues: {}

    entity:
      enabled: true
      task_queues: {}

# ── Feature Flags ────────────────────────────────────────────────────────────
features:
  enable_new_dashboard: false  # Env: ENABLE_NEW_DASHBOARD

# ── UI ───────────────────────────────────────────────────────────────────────
# The UI layer inherits HTTP server settings from the top-level `server` block.
# Only UI-specific overrides are listed here.
ui:
  server:
    idle_timeout: "120s"
    multi_port:
      # When enabled, each UI service runs on its own port.
      enabled: false          # Env: UI_MULTI_PORT
      console_port: "8081"    # Env: UI_CONSOLE_PORT
      workspace_port: "8082"  # Env: UI_WORKSPACE_PORT
      portal_port: "8083"     # Env: UI_PORTAL_PORT

  # ── UI services ────────────────────────────────────────────
  console:
    name: "Admin Console"
    description: "Administrative interface for system management"
    version: "1.0.0"
    enabled: true
    features:
      dark_mode: true
      notifications: true
      real_time_update: false
      bulk_operations: true
      export: true
      search: true
      multi_language: false

  workspace:
    name: "Tenant Workspace"
    description: "Collaborative workspace for tenant users"
    version: "1.0.0"
    enabled: true
    features:
      dark_mode: true
      notifications: true
      real_time_update: true
      bulk_operations: false
      export: true
      search: true
      multi_language: false

  portal:
    name: "Client Portal"
    description: "Self-service portal for end customers"
    version: "1.0.0"
    enabled: true
    features:
      dark_mode: true
      notifications: true
      real_time_update: false
      bulk_operations: false
      export: false
      search: true
      multi_language: false

  # ── Security ───────────────────────────────────────────────
  security:
    jwt:
      audience: "awo-erp-ui"   # Env: UI_JWT_AUDIENCE
      access_token_ttl: "15m"
      refresh_token_ttl: "24h"

    cors:
      enabled: true
      allowed_origins: []
      allowed_methods: []
      allowed_headers: []
      exposed_headers: []
      allow_credentials: true
      max_age: 86400

    csp:
      enabled: true
      default_src: "'self'"
      script_src: "'self' 'unsafe-inline' https://cdn.tailwindcss.com"
      style_src: "'self' 'unsafe-inline' https://cdn.tailwindcss.com"
      img_src: "'self' data: https:"
      font_src: "'self' https://fonts.gstatic.com"
      connect_src: "'self'"
      report_uri: ""
      report_only: false

    auth:
      oauth:
        enabled: false
        # When enabled, set per-provider credentials via env vars:
        #   OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET
        providers: {}
        redirect_url: ""

      saml:
        enabled: false
        metadata_url: ""
        entity_id: ""
        acs_url: ""
        cert_path: ""
        key_path: ""

      ldap:
        enabled: false
        host: ""        # Env: LDAP_HOST
        port: 389       # Env: LDAP_PORT
        use_tls: false
        base_dn: ""     # Env: LDAP_BASE_DN
        bind_dn: ""     # Env: LDAP_BIND_DN
        bind_passwd: "" # Env: LDAP_BIND_PASSWD
        user_filter: "(uid=%s)"

      mfa:
        enabled: false
        required: false
        methods: []        # totp | sms | email
        totp_issuer: "Awo ERP"
        sms_provider: ""

      password_policy:
        min_length: 8
        require_upper: true
        require_lower: true
        require_digit: true
        require_special: true
        max_age: 90       # days before password expires
        history_count: 5  # number of previous passwords remembered

    encryption:
      data_key: ""          # Env: UI_DATA_KEY
      key_derivation: "pbkdf2"
      force_https: true
      hsts_max_age: 31536000

  # ── Session ────────────────────────────────────────────────
  # Redis connection is inherited from the top-level `redis` block.
  session:
    cookie:
      name: "awo_session"
      domain: ""
      path: "/"
      secure: true
      http_only: true
      same_site: "Lax"   # Strict | Lax | None
    ttl: "8h"
    refresh_ttl: "720h"  # 30 days
    inactivity_timeout: "2h"
    max_concurrent: 3    # max simultaneous sessions per user
    regenerate: true     # regenerate session ID on login
    csrf_token: true

  # ── Assets ─────────────────────────────────────────────────
  assets:
    static_url: "/static"
    cache_max_age: "24h"
    compression_level: 6
    cdn:
      enabled: false
      base_url: ""
      key_id: ""     # Env: CDN_KEY_ID
      secret_key: "" # Env: CDN_SECRET_KEY
    build:
      source_path: "./web/src"
      build_path: "./internal/ui/assets"
      minify: true
      sourcemaps: false

  # ── Development helpers ────────────────────────────────────
  development:
    enabled: false       # Env: UI_DEV_MODE
    hot_reload: false
    mock_data: false
    debug_mode: false
    log_level: "info"
    log_requests: true
    log_responses: false
    profiling: false
    metrics: true
    dev_tools_port: "9090"
