# Application Configuration
app:
  name: "AwoERP"                    # Application name
  version: "0.1.0"                  # Application version
  stage: "dev"              # Options: development, staging, production, testing
  debug: true                       # Enable debug mode (overrides stage-based log level)
  environment: "local"              # Custom environment identifier
  namespace: "default"              # Kubernetes namespace or deployment namespace

# Server Configuration
server:
  port: "8080"                      # HTTP server port
  grpc_port: "9090"                 # gRPC server port
  read_timeout: "30s"               # HTTP read timeout
  write_timeout: "30s"              # HTTP write timeout
  host: "0.0.0.0"                   # Server bind address
  shutdown_timeout: "30s"           # Graceful shutdown timeout
  max_header_size: "1MB"            # Maximum header size
  idle_timeout: "60s"               # Keep-alive idle timeout

# Goa Configuration
goa:
  # OpenAPI/Swagger Configuration
  # openapi:
  #   enabled: true                   # Enable OpenAPI documentation
  #   path: "/swagger"                # Swagger UI path
  #   spec_path: "/openapi.json"      # OpenAPI spec endpoint
  #   title: "Ledger API"             # API title
  #   description: "Ledger service API documentation"
  #   version: "1.0.0"                # API version
  #   contact:
  #     name: "API Support"
  #     email: "api-support@example.com"
  #     url: "https://example.com/support"
  #   license:
  #     name: "MIT"
  #     url: "https://opensource.org/licenses/MIT"
  #   servers:
  #     - url: "http://localhost:8080"
  #       description: "Development server"
  #     - url: "https://api.example.com"
  #       description: "Production server"

  # CORS Configuration
  cors:
    enabled: true                   # Enable CORS middleware
    allow_origins:                  # Allowed origins
      - "http://localhost:3000"
      - "https://app.example.com"
    allow_methods:                  # Allowed HTTP methods
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
      - "PATCH"
    allow_headers:                  # Allowed headers
      - "Content-Type"
      - "Authorization"
      - "X-Requested-With"
      - "X-TenantID"
      - "Accept"
      - "Origin"
    expose_headers:                 # Exposed headers
      - "Content-Length"
      - "Content-Type"
      - "X-Total-Count"
    allow_credentials: true         # Allow credentials
    max_age: 86400                  # Preflight cache duration (seconds)

  # Request/Response Configuration
  request:
    max_body_size: "10MB"           # Maximum request body size
    timeout: "30s"                  # Request timeout
    rate_limit:
      enabled: true                 # Enable rate limiting
      requests_per_minute: 60       # Requests per minute per IP
      burst: 10                     # Burst capacity

  # Middleware Configuration
  middleware:
    request_id:
      enabled: true                 # Enable request ID middleware
      header: "X-Request-ID"        # Request ID header name
    
    logging:
      enabled: true                 # Enable request logging
      log_request_body: false       # Log request bodies (be careful with sensitive data)
      log_response_body: false      # Log response bodies
      skip_paths:                   # Paths to skip logging
        - "/health"
        - "/metrics"
        - "/swagger"
    
    recovery:
      enabled: true                 # Enable panic recovery
      
    metrics:
      enabled: true                 # Enable metrics collection
      path: "/metrics"              # Metrics endpoint path
      
    health:
      enabled: true                 # Enable health check endpoint
      path: "/health"               # Health check path
      detailed: false               # Include detailed health info

  # Security Configuration
  security:
    jwt:
      enabled: true                 # Enable JWT validation
      signing_method: "HS256"       # JWT signing method
      claims_map:                   # Custom claims mapping
        user_id: "sub"
        roles: "roles"
        permissions: "permissions"
    
    api_key:
      enabled: false                # Enable API key authentication
      header: "X-API-Key"           # API key header name
      
    basic_auth:
      enabled: false                # Enable basic authentication

  # Response Configuration
  response:
    default_format: "json"          # Default response format
    pretty_json: true               # Pretty print JSON in development
    include_stack_trace: false      # Include stack traces in errors (dev only)
    
  # File Upload Configuration
  upload:
    max_file_size: "50MB"           # Maximum file upload size
    allowed_types:                  # Allowed MIME types
      - "image/jpeg"
      - "image/png"
      - "image/gif"
      - "application/pdf"
      - "text/csv"
    temp_dir: "/tmp/uploads"        # Temporary upload directory
    
  # Circuit Breaker Configuration
  circuit_breaker:
    enabled: false                  # Enable circuit breaker
    failure_threshold: 5            # Failures before opening circuit
    reset_timeout: "60s"            # Reset timeout
    half_open_max_requests: 3       # Max requests in half-open state

# Database Configuration (PostgreSQL)
database:
  host: "localhost"                 # Use environment variables in production
  port: 5432
  user: "admin"
  password: "admin"
  database: "ledger"
  ssl_mode: "disable"               # SSL mode: disable, require, verify-ca, verify-full
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: "10m"
# database:
#   host: "localhost"                 # Database host
#   port: 5432                        # Database port
#   user: "admin"                     # Database username
#   password: "admin"                 # Database password
#   database: "ledger"                # Database name
#   ssl_mode: "disable"               # SSL mode: disable, require, verify-ca, verify-full
#   max_open_conns: 25                # Maximum open connections
#   max_idle_conns: 5                 # Maximum idle connections
#   conn_max_lifetime: "5m"           # Connection maximum lifetime
#
# Redis Configuration
redis:
  host: "localhost"                 # Redis host
  port: 6379                        # Redis port
  password: ""                      # Redis password (empty for no auth)
  db: 0                            # Redis database number

# Temporal Configuration
temporal:
  host_port: "localhost:7233"       # Temporal server host:port
  namespace: "default"
  workers:
    max_concurrent_activities: 100
    max_concurrent_workflows: 100
    worker_stop_timeout: 30s
  client:
    identity: "awo-erp"
    connection_timeout: 30s

# Authentication Configuration
auth:
  jwt_secret: "secret-key" # JWT signing secret (required for production)

# Feature Flags
features:
  enable_new_dashboard: false       # Enable new dashboard feature

# Logger Configuration
logger:
  type: "zerolog"                   # Logger type: zap, zerolog, slog
  level: "debug"                    # Log level: debug, info, warn, error, fatal
  format: "console"                 # Log format: json, text, console
  development: true                 # Enable development mode features
  service_name: "AwoERP"           # Service name for structured logging
  version: "1.0.0"                 # Service version for logging
  output: "stdout"                  # Output destination: stdout, stderr, or file path

# UI Configuration
ui:
  # UI Server settings
  server:
    port: "8080"
    host: "0.0.0.0"
    read_timeout: "30s"
    write_timeout: "30s"
    idle_timeout: "120s"
    multi_port:
      enabled: false
      console_port: "8081"
      workspace_port: "8082"
      portal_port: "8083"
    tls:
      enabled: false
      cert_file: ""
      key_file: ""
      min_version: "1.2"

  # Admin Console UI settings
  console:
    name: "Admin Console"
    description: "Administrative interface for system management"
    version: "1.0.0"
    enabled: true
    features:
      dark_mode: true
      notifications: true
      real_time_update: false
      bulk_operations: true
      export: true
      search: true
      multi_language: false

  # Tenant Workspace UI settings
  workspace:
    name: "Tenant Workspace"
    description: "Collaborative workspace for tenant users"
    version: "1.0.0"
    enabled: true
    features:
      dark_mode: true
      notifications: true
      real_time_update: true
      bulk_operations: false
      export: true
      search: true
      multi_language: false

  # Client Portal UI settings
  portal:
    name: "Client Portal"
    description: "Self-service portal for end customers"
    version: "1.0.0"
    enabled: true
    features:
      dark_mode: true
      notifications: true
      real_time_update: false
      bulk_operations: false
      export: false
      search: true
      multi_language: false

  # Security settings for UI
  security:
    jwt:
      algorithm: "RS256"
      public_key_path: ""
      private_key_path: ""
      issuer: "awo-erp"
      audience: "awo-erp-ui"
      access_token_ttl: "15m"
      refresh_token_ttl: "24h"
      clock_skew: "5m"
      validate_audience: true
      validate_issuer: true
    cors:
      enabled: true
      allowed_origins: []
      allowed_methods: []
      allowed_headers: []
      exposed_headers: []
      allow_credentials: true
      max_age: 86400
    csp:
      enabled: true
      default_src: "'self'"
      script_src: "'self' 'unsafe-inline' https://cdn.tailwindcss.com"
      style_src: "'self' 'unsafe-inline' https://cdn.tailwindcss.com"
      img_src: "'self' data: https:"
      font_src: "'self' https://fonts.gstatic.com"
      connect_src: "'self'"
      report_uri: ""
      report_only: false
    auth:
      oauth:
        enabled: false
        providers: {}
        redirect_url: ""
      saml:
        enabled: false
        metadata_url: ""
        entity_id: ""
        acs_url: ""
        cert_path: ""
        key_path: ""
      ldap:
        enabled: false
        host: ""
        port: 389
        use_tls: false
        base_dn: ""
        bind_dn: ""
        bind_passwd: ""
        user_filter: "(uid=%s)"
      mfa:
        enabled: false
        required: false
        methods: []
        totp_issuer: "Awo ERP"
        sms_provider: ""
      password_policy:
        min_length: 8
        require_upper: true
        require_lower: true
        require_digit: true
        require_special: true
        max_age: 90
        history_count: 5
    encryption:
      data_key: ""
      key_derivation: "pbkdf2"
      force_https: true
      hsts_max_age: 31536000

  # Session management for UI
  session:
    store: "redis"
    redis_url: "redis://localhost:6379"
    redis_db: 0
    key_prefix: "ui:session:"
    cookie:
      name: "awo_session"
      domain: ""
      path: "/"
      secure: true
      http_only: true
      same_site: "Lax"
    ttl: "8h"
    refresh_ttl: "720h" # 30 days
    inactivity_timeout: "2h"
    max_concurrent: 3
    regenerate: true
    csrf_token: true

  # Asset management for UI
  assets:
    static_url: "/static"
    cache_max_age: "24h"
    compression_level: 6
    cdn:
      enabled: false
      base_url: ""
      key_id: ""
      secret_key: ""
    build:
      source_path: "./web/src"
      build_path: "./internal/ui/assets"
      minify: true
      sourcemaps: false

  # Development settings for UI
  development:
    enabled: false
    hot_reload: false
    mock_data: false
    debug_mode: false
    log_level: "info"
    log_requests: true
    log_responses: false
    profiling: false
    metrics: true
    dev_tools_port: "9090"

# Migration Configuration
migration:
  url: "file://db/migration"

