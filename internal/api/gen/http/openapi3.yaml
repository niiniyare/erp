openapi: 3.0.3
info:
    title: Awo Enterprise Resource Planning Multi-Tenant API
    description: Comprehensive ERP system with RBAC/ABAC, finance, HR, and organizational management
    version: 1.0.0
servers:
    - url: https://api.erp.example.com
    - url: http://localhost:8080
paths:
    /openapi.json:
        get:
            tags:
                - openapi
            summary: spec openapi
            description: Get OpenAPI specification in JSON format
            operationId: openapi#spec
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SpecResponseBody'
                            example:
                                spec:
                                    info:
                                        title: Enterprise AWO ERP System API
                                        version: 1.0.0
                                    openapi: 3.0.3
                "500":
                    description: 'internal_error: Internal Server Error response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
    /swagger-ui:
        get:
            tags:
                - openapi
            summary: ui openapi
            description: Redirect to Swagger UI
            operationId: openapi#ui
            responses:
                "301":
                    description: Moved Permanently response.
                    headers:
                        Location:
                            description: Redirect location
                            schema:
                                type: string
                                description: Redirect location
                                example: /swagger-ui/
                            example: /swagger-ui/
