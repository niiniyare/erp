<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AWO ERP Documentation</title>
    <meta http-equiv="refresh" content="3; url=getting-started/01-developer-quick-start/">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        h1 {
            margin-top: 0;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .links {
            margin-top: 30px;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 15px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            display: inline-block;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        .loading {
            margin-top: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 AWO ERP Documentation</h1>
        <p>Welcome to the AWO ERP documentation portal. Choose your destination:</p>
        
        <div class="links">
            <a href="getting-started/01-developer-quick-start/">📚 Developer Guide</a>
            <a href="schema/">🗄️ Database Schema</a>
            <a href="http://localhost:8082/schema/" target="_blank">🔗 External Schema</a>
        </div>
        
        <div class="loading">
            <p>Redirecting to Developer Guide in <span id="countdown">3</span> seconds...</p>
        </div>
    </div>
    
    <script>
        let seconds = 3;
        const countdownEl = document.getElementById('countdown');
        
        const countdown = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = "getting-started/01-developer-quick-start/";
            }
        }, 1000);
        
        // Allow immediate navigation by clicking links
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                clearInterval(countdown);
            });
        });
    </script>
</body>
</html>
