<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awo ERP</title>

  <!-- Amis SDK (pinned version — do not upgrade without compatibility audit) -->
  <link rel="stylesheet" href="/static/sdk/sdk.css" />
  <link rel="stylesheet" href="/static/sdk/iconfont.css" />

  <style>
    /* ── CSS Custom Property Theme Tokens ───────────────────────────────────
     * Override these to customise branding without touching .cxd-* classes.
     * Dark mode: invert neutral scale on html.dark (see MEMORY.md dark theme).
     * ───────────────────────────────────────────────────────────────────── */
    :root {
      --colors-brand-primary:      #1677ff;
      --colors-brand-primary-dark: #0958d9;
      --background:                #f5f5f5;
      --body-bg:                   #f5f5f5;
      --Page-main-bg:              #f5f5f5;
      --Panel-bg-color:            #ffffff;
      --Table-bg:                  #ffffff;
    }

    html.dark {
      /* Invert neutral fill scale — all amis components inherit */
      --colors-neutral-fill-11:    #141414;
      --colors-neutral-fill-10:    #1d1d1d;
      --colors-neutral-fill-9:     #2a2a2a;
      --colors-neutral-fill-8:     #333333;
      --colors-neutral-text-2:     #e0e0e0;
      --colors-neutral-line-8:     #3a3a3a;
      --background:                #141414;
      --body-bg:                   #141414;
      --Page-main-bg:              #1a1a1a;
      --Panel-bg-color:            #1d1d1d;
      --Table-bg:                  #1d1d1d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--body-bg);
    }

    #app {
      min-height: 100vh;
    }

    .awo-layout {
      display: flex;
      min-height: 100vh;
    }

    .awo-sidebar {
      width: 240px;
      background: var(--Panel-bg-color);
      border-right: 1px solid var(--colors-neutral-line-8, #f0f0f0);
      flex-shrink: 0;
      overflow-y: auto;
    }

    .awo-main {
      flex: 1;
      overflow: auto;
      background: var(--Page-main-bg);
    }

    .awo-logo {
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 700;
      color: var(--colors-brand-primary);
      border-bottom: 1px solid var(--colors-neutral-line-8, #f0f0f0);
    }

    .awo-content {
      padding: 24px;
    }

    /* ── Navigation ────────────────────────────────────────────────────────── */
    .nav-module {
      padding: 8px 0 4px 0;
      border-bottom: 1px solid var(--colors-neutral-line-8, #f0f0f0);
    }

    .nav-module:last-child {
      border-bottom: none;
    }

    .nav-module-label {
      padding: 6px 20px 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--colors-neutral-text-2, #8c8c8c);
      user-select: none;
    }

    .nav-entry {
      display: block;
      padding: 7px 20px 7px 28px;
      font-size: 14px;
      color: inherit;
      text-decoration: none;
      border-left: 3px solid transparent;
      transition: background 0.12s, border-color 0.12s;
    }

    .nav-entry:hover {
      background: var(--colors-neutral-fill-9, #f5f5f5);
    }

    .nav-entry.active {
      border-left-color: var(--colors-brand-primary, #1677ff);
      color: var(--colors-brand-primary, #1677ff);
      background: rgba(22, 119, 255, 0.06);
      font-weight: 500;
    }

    .nav-loading {
      padding: 16px 20px;
      font-size: 13px;
      color: var(--colors-neutral-text-2, #8c8c8c);
    }
  </style>
</head>
<body>
<div id="app">
  <div class="awo-layout">
    <!-- Sidebar: auto-populated by navigation schema -->
    <nav class="awo-sidebar">
      <div class="awo-logo">Awo ERP</div>
      <div id="nav"></div>
    </nav>

    <!-- Main content: amis renders schemas here -->
    <main class="awo-main">
      <div id="content" class="awo-content"></div>
    </main>
  </div>
</div>

<script src="/static/sdk/sdk.js"></script>
<script>
(function () {
  'use strict';

  // ── Dark mode detection ────────────────────────────────────────────────────
  function applyTheme() {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  }
  applyTheme();
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  }

  // ── Route parsing ──────────────────────────────────────────────────────────
  // URL format: /ui/{module}/{resource}[/{id}][/edit|create]
  function parseRoute() {
    var parts = location.pathname.replace(/^\/ui\/?/, '').split('/').filter(Boolean);
    var last  = parts[parts.length - 1];
    return {
      module:   parts[0] || '',
      resource: parts[1] || '',
      id:       parts[2] && parts[2] !== 'create' && parts[2] !== 'edit' ? parts[2] : null,
      view:     last === 'edit'   ? 'edit'
              : last === 'create' ? 'create'
              : parts[2]          ? 'detail'
              :                     'list',
    };
  }

  // ── SDUI API URL builder ───────────────────────────────────────────────────
  // Maps a parsed route to the server SDUI endpoint.
  // GET /api/v1/ui/{module}/{resource}            → list
  // GET /api/v1/ui/{module}/{resource}/create     → create form
  // GET /api/v1/ui/{module}/{resource}/{id}       → detail
  // GET /api/v1/ui/{module}/{resource}/{id}/edit  → edit form
  function sduiURL(route) {
    var base = '/api/v1/ui/' + route.module + '/' + route.resource;
    switch (route.view) {
      case 'create': return base + '/create';
      case 'detail': return base + '/' + route.id;
      case 'edit':   return base + '/' + route.id + '/edit';
      default:       return base;
    }
  }

  // ── Amis schema loading ────────────────────────────────────────────────────
  function loadPage(route) {
    if (!route.module || !route.resource) return;

    var url = sduiURL(route);

    fetch(url, { credentials: 'include' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (schema) {
        // Server returns the AMIS schema directly (not wrapped).
        renderAmis(schema);
        updateNavActive(route);
      })
      .catch(function (err) {
        renderAmis({
          type: 'page',
          title: 'Error',
          body: { type: 'alert', level: 'danger', body: 'Failed to load page: ' + err.message }
        });
      });
  }

  // ── Amis rendering ─────────────────────────────────────────────────────────
  var currentApp = null;
  function renderAmis(schema) {
    var el = document.getElementById('content');
    if (currentApp) {
      amis.unmount(el);
    }
    currentApp = amis.embed(el, schema, {}, {
      fetcher: function (opts) {
        return fetch(opts.url, {
          method: opts.method || 'GET',
          headers: Object.assign({ 'Content-Type': 'application/json' }, opts.headers),
          body: opts.data ? JSON.stringify(opts.data) : undefined,
          credentials: 'include',
        }).then(function (r) { return r.json(); });
      }
    });
  }

  // ── Navigation loading ─────────────────────────────────────────────────────
  // GET /api/v1/ui/nav → [{module, label, entries: [{module, label, entity, listUrl, icon}]}]
  function loadNav() {
    var navEl = document.getElementById('nav');
    navEl.innerHTML = '<div class="nav-loading">Loading navigation...</div>';

    fetch('/api/v1/ui/nav', { credentials: 'include' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (modules) {
        renderNav(navEl, modules);
      })
      .catch(function () {
        navEl.innerHTML = '<div class="nav-loading">Navigation unavailable</div>';
      });
  }

  function renderNav(navEl, modules) {
    if (!modules || modules.length === 0) {
      navEl.innerHTML = '<div class="nav-loading">No modules</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < modules.length; i++) {
      var mod = modules[i];
      html += '<div class="nav-module">';
      html += '<div class="nav-module-label">' + escapeHtml(mod.label) + '</div>';
      if (mod.entries) {
        for (var j = 0; j < mod.entries.length; j++) {
          var entry = mod.entries[j];
          var icon = entry.icon ? '<span style="margin-right:6px;opacity:0.6;">' + escapeHtml(entry.icon) + '</span>' : '';
          // listUrl is already the /ui/{module}/{resource} path
          html += '<a class="nav-entry" href="' + escapeHtml(entry.listUrl) + '" data-url="' + escapeHtml(entry.listUrl) + '">'
                + icon + escapeHtml(entry.label) + '</a>';
        }
      }
      html += '</div>';
    }
    navEl.innerHTML = html;

    // Intercept clicks for client-side navigation.
    navEl.addEventListener('click', function (e) {
      var a = e.target.closest('a.nav-entry');
      if (!a) return;
      e.preventDefault();
      var href = a.getAttribute('href');
      history.pushState(null, '', href);
      loadPage(parseRoute());
    });

    updateNavActive(parseRoute());
  }

  function updateNavActive(route) {
    var entries = document.querySelectorAll('a.nav-entry');
    var current = location.pathname;
    for (var i = 0; i < entries.length; i++) {
      var href = entries[i].getAttribute('href');
      entries[i].classList.toggle('active', href === current || (route.module && route.resource && href === '/ui/' + route.module + '/' + route.resource));
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Bootstrap ──────────────────────────────────────────────────────────────
  loadNav();

  var route = parseRoute();
  if (route.module) {
    loadPage(route);
  } else {
    renderAmis({
      type: 'page',
      title: 'Awo ERP',
      body: [
        {
          type: 'tpl',
          tpl: '<div style="padding:48px 0;text-align:center;color:#8c8c8c;">'
             + '<div style="font-size:48px;margin-bottom:16px;">&#9677;</div>'
             + '<div style="font-size:18px;font-weight:500;margin-bottom:8px;">Welcome to Awo ERP</div>'
             + '<div style="font-size:14px;">Select a module from the sidebar to get started.</div>'
             + '</div>'
        }
      ]
    });
  }

  // Handle browser navigation.
  window.addEventListener('popstate', function () {
    loadPage(parseRoute());
  });
})();
</script>
</body>
</html>
