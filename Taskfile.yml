# See https://taskfile.dev/
version: '3'
vars:
  DB_NAME: '{{default "ledger" .DB_NAME}}'
  DB_USER: '{{default "admin" .DB_USER}}'
  DB_PSSWD: '{{default "admin" .DB_PSSWD}}'
  DB_URL: 'postgresql://{{.DB_USER}}:{{.DB_PSSWD}}@localhost:5432/{{.DB_NAME}}?sslmode=disable'
  MIGRATION_PATH: db/migration/
  SQLC_OUT: db/sqlc
  REQUIRED_TOOLS: sqlc protoc mockgen migrate dbdocs psql buf
# ============================================================================
# 🧪 General
# ============================================================================
tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
  check-tools:
    desc: Check required tools
    cmds:
      - |
        for tool in {{.REQUIRED_TOOLS}}; do
          if ! command -v $tool >/dev/null 2>&1; then
            echo "Missing: $tool"
            exit 1
          fi
        done
  clean:
    desc: Clean generated files
    cmds:
      - rm -f {{.PB}}/*.go doc/swagger/*.json
  ci:
    desc: Run all essential checks
    deps: [check-tools]
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: proto
      - task: sqlc
  sqlc-lint:
    desc: Detection of bad queries
    cmds:
      - ./db/queries/lint.sh
  sqlc:
    desc: Generate SQLC store code
    cmds:
      - sqlc generate
  mock:
    desc: Generate mocks for interfaces
    cmds:
      # - bash ./generate_all_mocks.sh
      - go generate  ./...
  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...
  goa:
    desc: Generate goa
    cmds:
      - goa gen github.com/niiniyare/erp/internal/api/design -o internal/api && rm -rf ./internal/api/swagger/openapi && cp -f ./internal/api/gen/http/openapi3.json ./internal/api/swagger
  lint:
    desc: Lint Go code
    cmds:
      - golangci-lint run ./...
  gen:
    desc: Generate all
    cmds:
      - task: sqlc
      - task: goa
  test-sqlc:
    desc: Testing only sqlc generated queries
    cmds:
      - TEST_DATABASE_URL='postgresql://admin:admin@localhost:5432/ledger?sslmode=disable' go test -v -cover -short ./db/sqlc
  test:
    desc: Run all tests
    cmds:
      - go test -v -cover ./...
  test-unit:
    desc: Run unit tests only
    cmds:
      - echo "🧪 Running unit tests..."
      - go test -tags=unit -race -timeout=10m -v ./internal/core/... ./internal/shared/... ./internal/adapters/...
  test-unit-fast:
    desc: Run unit tests without race detection (faster)
    cmds:
      - echo "⚡ Running unit tests (fast mode)..."
      - go test -tags=unit -timeout=5m ./internal/core/... ./internal/shared/... ./internal/adapters/...
  test-integration:
    desc: Run integration tests
    cmds:
      - echo "🔗 Running integration tests..."
      - echo "🐳 Starting dependencies..."
      - docker-compose -f docker-compose.test.yml up -d postgres redis || true
      - sleep 5
      - |
        go test -tags=integration -timeout=5m -v ./... || EXIT_CODE=$?
        echo "🧹 Cleaning up dependencies..."
        docker-compose -f docker-compose.test.yml down
        exit ${EXIT_CODE:-0}
  test-e2e:
    desc: Run end-to-end tests
    cmds:
      - echo "🌐 Running E2E tests..."
      - echo "🐳 Starting full environment..."
      - docker-compose -f docker-compose.test.yml up -d || true
      - sleep 10
      - |
        go test -tags=e2e -timeout=15m -v ./test/e2e/... || EXIT_CODE=$?
        echo "🧹 Cleaning up environment..."
        docker-compose -f docker-compose.test.yml down
        exit ${EXIT_CODE:-0}
  test-coverage:
    desc: Run tests with coverage report
    cmds:
      - echo "Running tests with coverage..."
      - go test -race -timeout=10m -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"
  test-benchmark:
    desc: Run benchmark tests
    cmds:
      - echo "🏃 Running benchmark tests..."
      - go test -bench=. -benchmem -timeout=10m ./...
  test-core:
    desc: Run only core layer tests
    cmds:
      - go test -v ./internal/core/...
  # Domain-specific tests
  test-identity:
    desc: Run identity domain tests
    cmds:
      - echo "🆔 Testing identity domain..."
      - go test -race -timeout=10m -v ./internal/core/identity/...
  test-access:
    desc: Run access domain tests
    cmds:
      - echo "🔐 Testing access domain..."
      - go test -race -timeout=10m -v ./internal/core/access/...
  test-audit:
    desc: Run audit domain tests
    cmds:
      - echo "📋 Testing audit domain..."
      - go test -race -timeout=10m -v ./internal/core/audit/...
  test-notification:
    desc: Run notification domain tests
    cmds:
      - echo "📢 Testing notification domain..."
      - go test -race -timeout=10m -v ./internal/core/notification/...
  test-analytics:
    desc: Run analytics domain tests
    cmds:
      - echo "📈 Testing analytics domain..."
      - go test -race -timeout=10m -v ./internal/core/analytics/...
  test-all:
    desc: Run complete test suite (unit + integration + e2e)
    cmds:
      - echo "🎯 Running complete test suite..."
      - task: test-unit
      - task: test-integration
      - task: test-e2e
      - echo "All tests completed successfully!"
  # Development workflow tests
  dev-test:
    desc: Quick development test cycle
    cmds:
      - echo "👨‍💻 Running development test cycle..."
      - task: test-unit-fast
      - go build ./...
  dev-test-coverage:
    desc: Development test with coverage
    cmds:
      - echo "👨‍💻 Running development test with coverage..."
      - go test -tags=unit -race -timeout=5m -coverprofile=coverage.out ./internal/core/... ./internal/shared/... ./internal/adapters/...
      - go tool cover -func=coverage.out
  # CI/CD pipeline commands
  ci-test:
    desc: CI test pipeline
    cmds:
      - echo "🚀 Running CI test pipeline..."
      - task: test-unit
      - task: test-integration
      - go test -race -timeout=10m -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1
  ci-full:
    desc: Full CI pipeline
    cmds:
      - echo "🚀 Running full CI pipeline..."
      - go build ./...
      - task: test-unit
      - task: test-integration
      - task: test-e2e
      - go test -race -timeout=10m -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1
  # Test cleanup
  test-clean:
    desc: Clean test artifacts
    cmds:
      - echo "🧹 Cleaning test artifacts..."
      - rm -f coverage.out coverage.html benchmark.out
      - docker-compose -f docker-compose.test.yml down -v --remove-orphans || true
  test-clean-cache:
    desc: Clean Go test cache
    cmds:
      - echo "🧹 Cleaning Go test cache..."
      - go clean -testcache
      - go clean -cache
      # ============================================================================
      # 🗃️ Repository Layer (SQLC Store, Repos, Converters)
      # ============================================================================
  test-repo:
    desc: Run tests related to repositories
    cmds:
      - go test -v ./internal/core/tenant/store/...
      # ============================================================================
      # 🏗️ Infrastructure Layer (Database, Redis, Config)
      # ============================================================================
  createdb:
    desc: Create the database
    cmds:
      - createdb --username="{{.DB_USER}}" --owner="{{.DB_USER}}" {{.DB_NAME}}
  dropdb:
    desc: Drop the database
    cmds:
      - dropdb {{.DB_NAME}}
  migrateup:
    desc: Run all up migrations
    cmds:
      - migrate -path "{{.MIGRATION_PATH}}" -database "{{.DB_URL}}" -verbose up
  migratedown:
    desc: Roll back the last migration
    cmds:
      - migrate -path "{{.MIGRATION_PATH}}" -database "{{.DB_URL}}" -verbose down
  migratedrop:
    desc: Drop all schema objects
    cmds:
      - migrate -path "{{.MIGRATION_PATH}}" -database "{{.DB_URL}}" -verbose drop
  migrate-create:
    desc: 'Create new migration file: task migrate-create name=init_users'
    cmds:
      - |
        if [ -z "{{.name}}" ]; then
          echo "Missing name param. Use: task migrate-create name=xyz"
          exit 1
        fi
        migrate create -ext sql -dir "{{.MIGRATION_PATH}}" -digits 2 -seq "{{.name}}" -verbose
  dbdocs:
    desc: Generate DB docs from DBML
    cmds:
      - dbdocs build docs/schema.dbml
  sql2dbml:
    desc: Convert SQL migration to DBML
    cmds:
      - sql2dbml {{.MIGRATION_PATH}}/*.up.sql --postgres -o docs/schema.dbml
      # ============================================================================
      # 🚀 App Entry (main.go / wiring)
      # ============================================================================
  run:
    desc: Run the app server
    cmds:
      - go run ./cmd/server/*.go
