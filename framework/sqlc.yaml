version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema:  "db/migrations"
    gen:
      go:
        package:       "sqlcgen"
        out:           "db/sqlcgen"
        emit_interface: true
        emit_json_tags: true
        emit_db_tags:   true
        emit_pointers_for_null_types: true
