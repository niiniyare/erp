      <div style="padding:12px;background:#eff6ff;border-radius:8px;font-size:13px;color:#1e40af;">
        <i class="fa fa-circle-info"></i> Auth is currently disabled. The shell boots directly
        into a dev session — see <code>shell.js</code> "AUTH (DISABLED)" section to re-enable.
      </div>
    </div>
  </div>

  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-content">
          <div class="brand-icon">A</div>
          <span class="brand-text">AWO ERP</span>
        </div>
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
          <i class="fa fa-bars"></i>
        </button>
      </div>
      <nav class="sidebar-menu" id="sidebarMenu">
        <div class="page-loading" style="height:80px;"><i class="fa fa-spinner fa-spin"></i></div>
      </nav>
    </aside>

    <div id="sidebar-backdrop" onclick="closeMobile()"></div>

    <div id="main">
      <div id="topbar">
        <button class="topbar-toggle" onclick="openMobile()"><i class="fa fa-bars"></i></button>
        <div class="breadcrumb">
          <span id="bc-module"></span>
          <span class="bc-sep" id="bc-sep" style="display:none">&rsaquo;</span>
          <span class="bc-current" id="bc-page">&mdash;</span>
        </div>
        <div class="topbar-spacer"></div>
        <div class="topbar-right">
          <div class="user-badge">
            <i class="fa fa-circle-user"></i>
            <span id="userName">&mdash;</span>
          </div>
          <button class="icon-btn" onclick="cycleTheme()">
            <i class="fa fa-circle-half-stroke"></i>
            <span id="themeLabel">System</span>
          </button>
          <!-- Logout disabled along with auth; button hidden rather than removed -->
          <button class="icon-btn" onclick="doLogout && doLogout()" title="Sign out" style="display:none;">
            <i class="fa fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>

      <div id="content">
        <div class="page-loading"><i class="fa fa-spinner fa-spin"></i> Loading&hellip;</div>
      </div>

      <div id="footer">&copy; 2026 AWO ERP</div>
    </div>
  </div>
