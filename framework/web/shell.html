<!DOCTYPE html>
<html lang="en" data-theme="system">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AWO ERP</title>
  <link rel="stylesheet" href="/sdk/sdk.css">
  <link rel="stylesheet" href="/sdk/helper.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/sdk/iconfont.css">
  <style>
    :root {
      --sidebar-w: 240px;
      --topbar-h: 52px;
      --brand: #1e40af;
      --brand-dark: #1e3a8a;
      --sidebar-bg: #0f172a;
      --sidebar-text: #cbd5e1;
      --sidebar-hover: #1e293b;
      --sidebar-active-bg: #1e40af;
      --sidebar-active-text: #fff;
      --sidebar-group: #64748b;
      --topbar-bg: #fff;
      --topbar-border: #e2e8f0;
      --content-bg: #f8fafc;
      --footer-text: #94a3b8;
    }

    [data-theme="dark"] {
      --topbar-bg: #1e293b;
      --topbar-border: #334155;
      --content-bg: #0f172a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    #app { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .2s ease, min-width .2s ease;
      z-index: 50;
    }

    #sidebar.collapsed { width: 56px; min-width: 56px; }

    .sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      height: var(--topbar-h);
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }

    .brand-content { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--brand); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; flex-shrink: 0;
    }
    .brand-text { font-weight: 700; font-size: 15px; color: #f1f5f9; white-space: nowrap; overflow: hidden; }
    #sidebar.collapsed .brand-text { display: none; }

    .sidebar-toggle {
      background: none; border: none; color: var(--sidebar-group);
      cursor: pointer; padding: 6px; border-radius: 6px; flex-shrink: 0;
      font-size: 14px;
    }
    .sidebar-toggle:hover { background: var(--sidebar-hover); color: #fff; }

    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 0;
    }
    .sidebar-menu::-webkit-scrollbar { width: 4px; }
    .sidebar-menu::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .nav-group-label {
      padding: 12px 16px 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--sidebar-group);
      white-space: nowrap;
      overflow: hidden;
    }
    #sidebar.collapsed .nav-group-label { visibility: hidden; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      cursor: pointer;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 13.5px;
      transition: background .15s;
      white-space: nowrap;
      overflow: hidden;
    }
    .nav-item:hover { background: var(--sidebar-hover); color: #f1f5f9; }
    .nav-item.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-text); }
    .nav-item i { width: 18px; text-align: center; font-size: 13px; flex-shrink: 0; }
    .nav-item span { overflow: hidden; text-overflow: ellipsis; }
    #sidebar.collapsed .nav-item span { display: none; }

    /* ── Main ────────────────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--content-bg);
    }

    #topbar {
      height: var(--topbar-h);
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--topbar-border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 40;
    }

    .topbar-toggle {
      display: none;
      background: none; border: none; cursor: pointer;
      font-size: 16px; color: #64748b; padding: 6px;
    }

    .breadcrumb { font-size: 13px; color: #64748b; display: flex; align-items: center; gap: 6px; }
    .bc-sep { color: #cbd5e1; }
    .bc-current { color: #1e293b; font-weight: 500; }

    .topbar-spacer { flex: 1; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }

    .user-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 10px; border-radius: 20px;
      background: #f1f5f9; font-size: 13px; color: #475569;
    }
    .user-badge i { color: #94a3b8; }

    .icon-btn {
      background: none; border: 1px solid #e2e8f0;
      border-radius: 6px; padding: 5px 10px;
      cursor: pointer; font-size: 12px; color: #64748b;
      display: flex; align-items: center; gap: 6px;
    }
    .icon-btn:hover { background: #f1f5f9; }

    #content {
      flex: 1;
      overflow: auto;
      padding: 20px;
      isolation: isolate;
    }

    .page-loading {
      display: flex; align-items: center; justify-content: center;
      height: 200px; color: #94a3b8; font-size: 14px; gap: 10px;
    }

    .page-error {
      margin: 40px auto; max-width: 480px; padding: 24px;
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 8px; color: #b91c1c; font-size: 14px;
    }
    .page-error h3 { margin-bottom: 8px; }

    #footer {
      padding: 8px 20px;
      font-size: 12px;
      color: var(--footer-text);
      border-top: 1px solid var(--topbar-border);
      background: var(--topbar-bg);
      flex-shrink: 0;
    }

    /* ── Login overlay ───────────────────────────────────────────────── */
    #login-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      display: flex; align-items: center; justify-content: center;
    }
    #login-overlay.hidden { display: none; }

    .login-card {
      background: #fff; border-radius: 16px; padding: 40px;
      width: 100%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,.4);
    }
    .login-logo {
      display: flex; align-items: center; gap: 12px; margin-bottom: 32px;
    }
    .login-logo-icon {
      width: 44px; height: 44px; border-radius: 10px;
      background: var(--brand); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 20px;
    }
    .login-logo-text { font-size: 20px; font-weight: 700; color: #0f172a; }
    .login-logo-sub { font-size: 12px; color: #94a3b8; }

    .tab-bar {
      display: flex; gap: 0; margin-bottom: 24px;
      border-bottom: 2px solid #e5e7eb;
    }
    .tab-btn {
      flex: 1; padding: 8px; border: none; background: none;
      font-size: 14px; cursor: pointer; color: #94a3b8; font-weight: 500;
    }
    .tab-btn.active {
      font-weight: 600; color: var(--brand);
      border-bottom: 2px solid var(--brand); margin-bottom: -2px;
    }

    .login-field { margin-bottom: 18px; }
    .login-field label {
      display: block; font-size: 13px; font-weight: 500;
      color: #374151; margin-bottom: 6px;
    }
    .login-field input {
      width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 14px; outline: none;
      transition: border-color .15s;
    }
    .login-field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(30,64,175,.1); }

    .login-btn {
      width: 100%; padding: 11px; background: var(--brand); color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .login-btn:hover { background: var(--brand-dark); }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }

    .login-error {
      margin-top: 14px; padding: 10px 12px; border-radius: 8px;
      background: #fef2f2; color: #b91c1c; font-size: 13px; display: none;
    }
    .login-error.visible { display: block; }

    /* ── Mobile ──────────────────────────────────────────────────────── */
    #sidebar-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 190;
    }

    @media (max-width: 768px) {
      #sidebar {
        position: fixed; top: 0; left: 0; bottom: 0;
        transform: translateX(-100%); transition: transform .25s ease;
        z-index: 200;
      }
      #sidebar.mobile-open { transform: translateX(0); width: var(--sidebar-w) !important; min-width: var(--sidebar-w) !important; }
      #sidebar-backdrop.visible { display: block; }
      .topbar-toggle { display: flex; }
      #main { width: 100%; }
      .brand-text { display: block !important; }
      .nav-item span { display: inline !important; }
    }
  </style>
</head>

<body>
  <div id="login-overlay">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">A</div>
        <div>
          <div class="login-logo-text">AWO ERP</div>
          <div class="login-logo-sub">Sign in to your workspace</div>
        </div>
      </div>
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Tenant sign in</button>
        <button class="tab-btn" id="tab-platform" onclick="switchTab('platform')">Platform admin</button>
      </div>

      <!-- Tenant login form -->
      <form id="login-form" onsubmit="submitLogin(event)">
        <div class="login-field">
          <label for="login-tenant">Workspace</label>
          <input id="login-tenant" type="text" placeholder="your-workspace" autocomplete="organization" required>
        </div>
        <div class="login-field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="login-field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button class="login-btn" type="submit" id="login-submit">Sign in</button>
        <div class="login-error" id="login-error"></div>
      </form>

      <!-- Platform admin login form -->
      <form id="platform-form" onsubmit="submitPlatformLogin(event)" style="display:none;">
        <div class="login-field" style="margin-bottom:12px;padding:10px 12px;background:#fef9c3;border-radius:8px;font-size:12px;color:#854d0e;">
          <i class="fa fa-shield-halved"></i> Platform administrator access. Requires <code>PLATFORM_ROOT_EMAIL</code> configured on the server.
        </div>
        <div class="login-field">
          <label for="plat-email">Email</label>
          <input id="plat-email" type="email" placeholder="admin@example.com" autocomplete="email" required>
        </div>
        <div class="login-field">
          <label for="plat-password">Password</label>
          <input id="plat-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button class="login-btn" type="submit" id="plat-submit">Sign in as platform admin</button>
        <div class="login-error" id="plat-error"></div>
      </form>
    </div>
  </div>

  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-content">
          <div class="brand-icon">A</div>
          <span class="brand-text">AWO ERP</span>
        </div>
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
          <i class="fa fa-bars"></i>
        </button>
      </div>
      <nav class="sidebar-menu" id="sidebarMenu">
        <div class="page-loading" style="height:80px;"><i class="fa fa-spinner fa-spin"></i></div>
      </nav>
    </aside>

    <div id="sidebar-backdrop" onclick="closeMobile()"></div>

    <div id="main">
      <div id="topbar">
        <button class="topbar-toggle" onclick="openMobile()"><i class="fa fa-bars"></i></button>
        <div class="breadcrumb">
          <span id="bc-module"></span>
          <span class="bc-sep" id="bc-sep" style="display:none">›</span>
          <span class="bc-current" id="bc-page">—</span>
        </div>
        <div class="topbar-spacer"></div>
        <div class="topbar-right">
          <div class="user-badge">
            <i class="fa fa-circle-user"></i>
            <span id="userName">—</span>
          </div>
          <button class="icon-btn" onclick="cycleTheme()">
            <i class="fa fa-circle-half-stroke"></i>
            <span id="themeLabel">System</span>
          </button>
          <button class="icon-btn" onclick="doLogout()" title="Sign out">
            <i class="fa fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>

      <div id="content">
        <div class="page-loading"><i class="fa fa-spinner fa-spin"></i> Loading…</div>
      </div>

      <div id="footer">&copy; 2026 AWO ERP</div>
    </div>
  </div>

  <!-- Create Tenant modal (platform admin only) -->
  <div id="create-tenant-modal" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.5);align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:16px;padding:32px;width:100%;max-width:440px;box-shadow:0 25px 50px rgba(0,0,0,.4);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <h2 style="font-size:18px;font-weight:700;color:#0f172a;margin:0;">Create workspace</h2>
        <button onclick="closeCreateTenant()" style="background:none;border:none;font-size:18px;color:#94a3b8;cursor:pointer;"><i class="fa fa-xmark"></i></button>
      </div>
      <form id="create-tenant-form" onsubmit="submitCreateTenant(event)">
        <div class="login-field">
          <label for="ct-workspace">Workspace name</label>
          <input id="ct-workspace" type="text" placeholder="Acme Corp" required>
        </div>
        <div class="login-field">
          <label for="ct-name">Admin full name</label>
          <input id="ct-name" type="text" placeholder="Jane Doe" required>
        </div>
        <div class="login-field">
          <label for="ct-email">Admin email</label>
          <input id="ct-email" type="email" placeholder="admin@acme.com" required>
        </div>
        <div class="login-field">
          <label for="ct-password">Admin password <small style="color:#94a3b8;">(min 8 chars)</small></label>
          <input id="ct-password" type="password" placeholder="••••••••" minlength="8" required>
        </div>
        <div style="display:flex;gap:12px;margin-top:4px;">
          <button type="button" onclick="closeCreateTenant()" style="flex:1;padding:10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:14px;cursor:pointer;color:#64748b;">Cancel</button>
          <button class="login-btn" type="submit" id="ct-submit" style="flex:2;">Create workspace</button>
        </div>
        <div class="login-error" id="ct-error"></div>
      </form>
    </div>
  </div>

  <script src="/sdk/sdk.js"></script>
  <script src="/sdk/charts.js"></script>
  <script>
  (function () {
    /* ── Config ──────────────────────────────────────────────── */
    var NAV_API   = '/sdui/nav';
    var SDUI_BASE = '/sdui';
    var API_BASE  = '/api';

    /* ── State ───────────────────────────────────────────────── */
    var currentTenant   = localStorage.getItem('awo-tenant') || '';
    var currentInstance = null;
    var navIndex        = {}; // entity id → NavItem

    /* ── Theme ───────────────────────────────────────────────── */
    var themes   = ['system', 'light', 'dark'];
    var themeIdx = themes.indexOf(localStorage.getItem('awo-theme') || 'system');
    function applyTheme() {
      var t = themes[themeIdx];
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeLabel').textContent = t.charAt(0).toUpperCase() + t.slice(1);
      localStorage.setItem('awo-theme', t);
    }
    window.cycleTheme = function () { themeIdx = (themeIdx + 1) % themes.length; applyTheme(); };
    applyTheme();

    /* ── Sidebar collapse ─────────────────────────────────────── */
    var sidebar          = document.getElementById('sidebar');
    var sidebarCollapsed = localStorage.getItem('awo-sidebar') === 'collapsed';
    if (sidebarCollapsed) sidebar.classList.add('collapsed');
    window.toggleSidebar = function () {
      sidebarCollapsed = !sidebarCollapsed;
      sidebar.classList.toggle('collapsed', sidebarCollapsed);
      localStorage.setItem('awo-sidebar', sidebarCollapsed ? 'collapsed' : '');
    };
    var backdrop = document.getElementById('sidebar-backdrop');
    window.openMobile  = function () { sidebar.classList.add('mobile-open'); backdrop.classList.add('visible'); };
    window.closeMobile = function () { sidebar.classList.remove('mobile-open'); backdrop.classList.remove('visible'); };

    /* ── AMIS env ─────────────────────────────────────────────── */
    var amisEmbed = amisRequire('amis/embed');

    var amisEnv = {
      locale: 'en-US',
      fetcher: function (api) {
        var url    = api.url || '';
        var method = (api.method || 'get').toLowerCase();

        // Translate AMIS page/perPage → offset/limit
        var urlObj = new URL(url, window.location.origin);
        var page    = urlObj.searchParams.get('page') || urlObj.searchParams.get('$page');
        var perPage = urlObj.searchParams.get('perPage') || urlObj.searchParams.get('$perPage');
        if (page !== null) {
          var limit  = perPage ? parseInt(perPage, 10) : 20;
          var offset = (parseInt(page, 10) - 1) * limit;
          urlObj.searchParams.delete('page'); urlObj.searchParams.delete('$page');
          urlObj.searchParams.set('offset', String(offset));
        }
        if (perPage !== null) {
          urlObj.searchParams.delete('perPage'); urlObj.searchParams.delete('$perPage');
          urlObj.searchParams.set('limit', perPage);
        }
        url = urlObj.toString();

        var headers = Object.assign(
          { 'Content-Type': 'application/json', 'X-Awo-Tenant': currentTenant },
          api.headers || {}
        );
        var opts = { method: method, headers: headers, credentials: 'include' };
        if (method !== 'get' && method !== 'head' && api.data) {
          opts.body = JSON.stringify(api.data);
        }

        return fetch(url, opts)
          .then(function (res) {
            if (res.status === 401) {
              showLogin('Session expired — please sign in again.');
              return { status: 401, msg: 'Unauthorized' };
            }
            if (res.status === 204) return { status: 0, msg: '' };
            return res.json().then(function (body) {
              if (body.status === undefined) {
                if (!res.ok) return { status: res.status, msg: body.error || body.msg || res.statusText };
                return { status: 0, msg: '', data: body };
              }
              return body;
            });
          })
          .catch(function (err) {
            return { status: 1, msg: 'Network error: ' + err.message };
          });
      },
      isCancel: function () { return false; },
      notify: function (type, msg) { console.log('[amis:' + type + ']', msg); },
      alert: window.alert.bind(window),
      copy: function (text) { if (navigator.clipboard) navigator.clipboard.writeText(text); }
    };

    /* ── Nav ──────────────────────────────────────────────────── */
    function loadNav() {
      fetch(NAV_API, { credentials: 'include', headers: { 'X-Awo-Tenant': currentTenant } })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (groups) {
          var menu = document.getElementById('sidebarMenu');
          menu.innerHTML = '';

          // Dashboard always first
          var dash = document.createElement('a');
          dash.className = 'nav-item';
          dash.id = 'nav-__dashboard';
          dash.href = '#__dashboard';
          dash.innerHTML = '<i class="fa fa-chart-line"></i><span>Dashboard</span>';
          dash.addEventListener('click', closeMobile);
          menu.appendChild(dash);
          navIndex['__dashboard'] = { label: 'Dashboard', module: '' };

          groups.forEach(function (g) {
            var grpEl = document.createElement('div');
            grpEl.className = 'nav-group-label';
            grpEl.textContent = g.group;
            menu.appendChild(grpEl);

            g.items.forEach(function (item) {
              navIndex[item.id] = item;
              var a = document.createElement('a');
              a.className = 'nav-item';
              a.id = 'nav-' + item.id;
              a.href = '#' + item.id;
              // Default icon per module, override with item.icon if set
              var icon = item.icon || moduleIcon(g.group);
              a.innerHTML = '<i class="fa ' + icon + '"></i><span>' + item.label + '</span>';
              a.addEventListener('click', closeMobile);
              menu.appendChild(a);
            });
          });

          navigate();
        })
        .catch(function () {
          document.getElementById('sidebarMenu').innerHTML =
            '<div style="padding:16px;color:#94a3b8;font-size:13px;">Failed to load nav</div>';
        });
    }

    function moduleIcon(mod) {
      var icons = {
        'Finance': 'fa-book', 'Inventory': 'fa-box', 'HR': 'fa-users',
        'CRM': 'fa-building', 'Platform': 'fa-shield', 'Forecourt': 'fa-gas-pump',
      };
      return icons[mod] || 'fa-table';
    }

    /* ── Router ───────────────────────────────────────────────── */
    var content = document.getElementById('content');

    function setActive(entity) {
      document.querySelectorAll('.nav-item').forEach(function (el) { el.classList.remove('active'); });
      var el = document.getElementById('nav-' + entity);
      if (el) el.classList.add('active');

      var item = navIndex[entity];
      if (item) {
        document.getElementById('bc-page').textContent = item.label || entity;
        if (item.module) {
          document.getElementById('bc-module').textContent = item.module;
          document.getElementById('bc-sep').style.display = '';
        } else {
          document.getElementById('bc-module').textContent = '';
          document.getElementById('bc-sep').style.display = 'none';
        }
      }
    }

    function navigate() {
      var entity = window.location.hash.slice(1) || (currentPlane === 'platform' ? '__platform-tenants' : '__dashboard');
      setActive(entity);

      if (currentInstance) {
        try { currentInstance.unmount(); } catch (e) {}
        currentInstance = null;
      }
      content.innerHTML = '<div class="page-loading"><i class="fa fa-spinner fa-spin"></i> Loading…</div>';

      // Platform admin built-in pages
      if (entity === '__platform-tenants') {
        renderPlatformTenantsPage();
        return;
      }
      if (entity === '__platform-users') {
        content.innerHTML = '<div style="padding:24px;color:#64748b;">Platform user management — coming soon.</div>';
        return;
      }

      var schemaURL = entity === '__dashboard'
        ? '/schemas/pages/dashboard.json'
        : SDUI_BASE + '/' + entity;

      var token = localStorage.getItem('awo-token') || '';
      fetch(schemaURL, {
        credentials: 'include',
        headers: { 'X-Awo-Tenant': currentTenant, 'Authorization': token ? 'Bearer ' + token : '' }
      })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (schema) {
          content.innerHTML = '';
          currentInstance = amisEmbed('#content', schema, {}, amisEnv);
        })
        .catch(function (err) {
          content.innerHTML = '<div class="page-error"><h3>Page error</h3><p>' + entity + ' — ' + err.message + '</p></div>';
        });
    }

    function renderPlatformTenantsPage() {
      var token = localStorage.getItem('awo-token') || '';
      fetch('/api/tenants', {
        credentials: 'include',
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(function (r) { return r.ok ? r.json() : { data: [] }; })
      .then(function (body) {
        var tenants = Array.isArray(body.data) ? body.data : (Array.isArray(body) ? body : []);
        var rows = tenants.map(function (t) {
          return '<tr>' +
            '<td style="padding:10px 12px;">' + esc(t.name || t.slug || t.id) + '</td>' +
            '<td style="padding:10px 12px;color:#64748b;">' + esc(t.slug || '') + '</td>' +
            '<td style="padding:10px 12px;"><span style="padding:2px 8px;border-radius:4px;font-size:12px;background:' + statusBg(t.status) + ';color:' + statusFg(t.status) + ';">' + esc(t.status || '') + '</span></td>' +
            '<td style="padding:10px 12px;color:#94a3b8;font-size:12px;">' + esc(t.created_at ? t.created_at.slice(0,10) : '') + '</td>' +
            '</tr>';
        }).join('');

        content.innerHTML =
          '<div style="padding:24px;">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">' +
          '<h2 style="font-size:18px;font-weight:700;color:#0f172a;margin:0;">Workspaces</h2>' +
          '<button onclick="openCreateTenant()" style="padding:8px 16px;background:#1e40af;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;"><i class="fa fa-plus"></i> New workspace</button>' +
          '</div>' +
          (tenants.length === 0
            ? '<div style="padding:40px;text-align:center;color:#94a3b8;border:2px dashed #e2e8f0;border-radius:12px;">No workspaces yet. <a href="#" onclick="openCreateTenant();return false;" style="color:#1e40af;">Create one.</a></div>'
            : '<table style="width:100%;border-collapse:collapse;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden;">' +
              '<thead><tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">' +
              '<th style="padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:#64748b;">Name</th>' +
              '<th style="padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:#64748b;">Slug</th>' +
              '<th style="padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:#64748b;">Status</th>' +
              '<th style="padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:#64748b;">Created</th>' +
              '</tr></thead><tbody>' + rows + '</tbody></table>') +
          '</div>';
      })
      .catch(function () {
        content.innerHTML = '<div class="page-error"><h3>Failed to load tenants</h3></div>';
      });
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function statusBg(s) { return s === 'active' ? '#dcfce7' : s === 'suspended' ? '#fef9c3' : '#f1f5f9'; }
    function statusFg(s) { return s === 'active' ? '#166534' : s === 'suspended' ? '#854d0e' : '#475569'; }

    window.addEventListener('hashchange', function () {
      if (document.getElementById('login-overlay').classList.contains('hidden')) navigate();
    });

    /* ── Auth state ───────────────────────────────────────────── */
    var currentPlane = localStorage.getItem('awo-plane') || ''; // 'tenant' | 'platform'

    window.switchTab = function (tab) {
      var isLogin    = tab === 'login';
      var isPlatform = tab === 'platform';
      document.getElementById('login-form').style.display    = isLogin    ? '' : 'none';
      document.getElementById('platform-form').style.display = isPlatform ? '' : 'none';
      document.getElementById('tab-login').className    = 'tab-btn' + (isLogin    ? ' active' : '');
      document.getElementById('tab-platform').className = 'tab-btn' + (isPlatform ? ' active' : '');
    };

    function showLogin(msg) {
      document.getElementById('login-overlay').classList.remove('hidden');
      if (currentTenant) document.getElementById('login-tenant').value = currentTenant;
      var errEl = document.getElementById('login-error');
      if (msg) { errEl.textContent = msg; errEl.classList.add('visible'); }
      else      { errEl.classList.remove('visible'); }
    }

    function hideLogin() {
      document.getElementById('login-overlay').classList.add('hidden');
      document.getElementById('login-error').classList.remove('visible');
      document.getElementById('plat-error').classList.remove('visible');
    }

    /* ── Tenant login ──────────────────────────────────────────── */
    window.submitLogin = function (e) {
      e.preventDefault();
      var tenant = document.getElementById('login-tenant').value.trim();
      var email  = document.getElementById('login-email').value.trim();
      var pass   = document.getElementById('login-password').value;
      var btn    = document.getElementById('login-submit');
      var errEl  = document.getElementById('login-error');

      btn.disabled = true; btn.textContent = 'Signing in…';
      errEl.classList.remove('visible');

      fetch('/auth/login', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json', 'X-Awo-Tenant': tenant },
        body: JSON.stringify({ email: email, password: pass })
      })
      .then(function (r) { return r.json(); })
      .then(function (body) {
        if (body.status === 0 && body.data) {
          currentTenant = tenant;
          currentPlane  = 'tenant';
          localStorage.setItem('awo-tenant', tenant);
          localStorage.setItem('awo-plane', 'tenant');
          localStorage.setItem('awo-token', body.data.access_token || '');
          document.getElementById('userName').textContent = body.data.display_name || email;
          hideLogin();
          loadNav();
        } else {
          errEl.textContent = body.msg || 'Login failed';
          errEl.classList.add('visible');
        }
      })
      .catch(function (err) { errEl.textContent = 'Network error: ' + err.message; errEl.classList.add('visible'); })
      .finally(function () { btn.disabled = false; btn.textContent = 'Sign in'; });
    };

    /* ── Platform admin login ──────────────────────────────────── */
    window.submitPlatformLogin = function (e) {
      e.preventDefault();
      var email = document.getElementById('plat-email').value.trim();
      var pass  = document.getElementById('plat-password').value;
      var btn   = document.getElementById('plat-submit');
      var errEl = document.getElementById('plat-error');

      btn.disabled = true; btn.textContent = 'Signing in…';
      errEl.classList.remove('visible');

      fetch('/auth/platform/login', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: pass })
      })
      .then(function (r) { return r.json(); })
      .then(function (body) {
        if (body.status === 0 && body.data) {
          currentTenant = '';
          currentPlane  = 'platform';
          localStorage.setItem('awo-tenant', '');
          localStorage.setItem('awo-plane', 'platform');
          localStorage.setItem('awo-token', body.data.access_token || '');
          document.getElementById('userName').textContent = 'Platform Admin';
          hideLogin();
          loadPlatformNav();
        } else {
          errEl.textContent = body.msg || 'Login failed';
          errEl.classList.add('visible');
        }
      })
      .catch(function (err) { errEl.textContent = 'Network error: ' + err.message; errEl.classList.add('visible'); })
      .finally(function () { btn.disabled = false; btn.textContent = 'Sign in as platform admin'; });
    };

    /* ── Logout ────────────────────────────────────────────────── */
    window.doLogout = function () {
      var token = localStorage.getItem('awo-token') || '';
      fetch('/auth/logout', {
        method: 'POST', credentials: 'include',
        headers: { 'Authorization': 'Bearer ' + token, 'X-Awo-Tenant': currentTenant }
      }).finally(function () {
        localStorage.removeItem('awo-token');
        localStorage.removeItem('awo-plane');
        currentPlane = '';
        showLogin();
      });
    };

    /* ── Create Tenant (platform admin) ───────────────────────── */
    window.openCreateTenant = function () {
      var modal = document.getElementById('create-tenant-modal');
      modal.style.display = 'flex';
      document.getElementById('ct-workspace').focus();
    };
    window.closeCreateTenant = function () {
      document.getElementById('create-tenant-modal').style.display = 'none';
      document.getElementById('create-tenant-form').reset();
      document.getElementById('ct-error').classList.remove('visible');
    };

    window.submitCreateTenant = function (e) {
      e.preventDefault();
      var workspace = document.getElementById('ct-workspace').value.trim();
      var name      = document.getElementById('ct-name').value.trim();
      var email     = document.getElementById('ct-email').value.trim();
      var pass      = document.getElementById('ct-password').value;
      var btn       = document.getElementById('ct-submit');
      var errEl     = document.getElementById('ct-error');
      var token     = localStorage.getItem('awo-token') || '';

      btn.disabled = true; btn.textContent = 'Creating…';
      errEl.classList.remove('visible');

      fetch('/auth/register', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ workspace_name: workspace, admin_name: name, admin_email: email, password: pass })
      })
      .then(function (r) { return r.json(); })
      .then(function (body) {
        if ((body.status === 0 || body.status === 201) && body.data) {
          closeCreateTenant();
          // Refresh the tenant list page
          navigate();
        } else {
          errEl.textContent = body.msg || body.error || 'Creation failed';
          errEl.classList.add('visible');
        }
      })
      .catch(function (err) { errEl.textContent = 'Network error: ' + err.message; errEl.classList.add('visible'); })
      .finally(function () { btn.disabled = false; btn.textContent = 'Create workspace'; });
    };

    /* ── Session restore ───────────────────────────────────────── */
    function checkSession() {
      var token = localStorage.getItem('awo-token') || '';
      var plane = localStorage.getItem('awo-plane') || '';
      if (!token) { showLogin(); return; }

      fetch('/auth/me', {
        credentials: 'include',
        headers: { 'Authorization': 'Bearer ' + token, 'X-Awo-Tenant': currentTenant }
      })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (body) {
        if (body && body.status === 0 && body.data) {
          currentPlane = body.data.plane || plane;
          localStorage.setItem('awo-plane', currentPlane);
          if (currentPlane === 'platform') {
            document.getElementById('userName').textContent = 'Platform Admin';
            hideLogin();
            loadPlatformNav();
          } else {
            document.getElementById('userName').textContent = body.data.display_name || body.data.user_id;
            hideLogin();
            loadNav();
          }
        } else {
          showLogin();
        }
      })
      .catch(function () { showLogin(); });
    }

    /* ── Platform admin nav ────────────────────────────────────── */
    function loadPlatformNav() {
      var menu = document.getElementById('sidebarMenu');
      menu.innerHTML = '';

      var items = [
        { id: '__platform-tenants', label: 'Tenants',       icon: 'fa-building-columns' },
        { id: '__platform-users',   label: 'Platform Users', icon: 'fa-user-shield' },
      ];
      items.forEach(function (item) {
        navIndex[item.id] = { label: item.label, module: 'Platform' };
        var a = document.createElement('a');
        a.className = 'nav-item';
        a.id = 'nav-' + item.id;
        a.href = '#' + item.id;
        a.innerHTML = '<i class="fa ' + item.icon + '"></i><span>' + item.label + '</span>';
        a.addEventListener('click', closeMobile);
        menu.appendChild(a);
      });

      // "Create workspace" action button
      var divider = document.createElement('div');
      divider.className = 'nav-group-label';
      divider.textContent = 'Actions';
      menu.appendChild(divider);

      var btn = document.createElement('a');
      btn.className = 'nav-item';
      btn.href = '#';
      btn.innerHTML = '<i class="fa fa-plus-circle"></i><span>New workspace</span>';
      btn.addEventListener('click', function (e) { e.preventDefault(); openCreateTenant(); });
      menu.appendChild(btn);

      navigate();
    }

    checkSession();
  })();
  </script>
</body>
</html>
