<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Register — AWO ERP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #f0f2f5;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --border: #e5e7eb;
      --input-bg: #f9fafb;
      --input-border: #d1d5db;
      --input-focus: #2196f3;
      --btn-bg: #2196f3;
      --btn-hover: #1976d2;
      --btn-text: #ffffff;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #dc2626;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #166534;
      --card-shadow: 0 4px 24px rgba(0,0,0,0.08);
      --brand: #2196f3;
    }

    html.dark {
      --bg-main: #151521;
      --bg-card: #1e1e2d;
      --text-primary: #e4e4e7;
      --text-secondary: #9a9ab0;
      --text-muted: #6b6b80;
      --border: #2e2e3e;
      --input-bg: #262637;
      --input-border: #3a3a4e;
      --error-bg: #3b0d0d;
      --error-border: #7f1d1d;
      --error-text: #fca5a5;
      --success-bg: #052e16;
      --success-border: #14532d;
      --success-text: #86efac;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      padding: 40px 36px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--brand);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      flex-shrink: 0;
    }

    .brand-name { font-size: 20px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }
    .brand-tagline { font-size: 11px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }

    h1 { font-size: 22px; font-weight: 600; color: var(--text-primary); margin: 0 0 6px; }
    .subtitle { font-size: 14px; color: var(--text-secondary); margin: 0 0 28px; }

    .field { margin-bottom: 18px; }

    label { display: block; font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 6px; }

    .input-wrap { position: relative; }

    .input-wrap .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 13px;
      pointer-events: none;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 42px;
      padding: 0 12px 0 36px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
    }

    input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(33,150,243,0.12);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      padding: 4px;
      line-height: 1;
    }

    .password-toggle:hover { color: var(--text-secondary); }

    .alert {
      display: none;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 18px;
      font-size: 13px;
      align-items: center;
      gap: 8px;
    }

    .alert.visible { display: flex; }
    .alert.error { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); }
    .alert.success { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success-text); }

    .btn-submit {
      width: 100%;
      height: 44px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-submit:hover:not(:disabled) { background: var(--btn-hover); }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }

    .btn-submit .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .btn-submit.loading .spinner { display: block; }
    .btn-submit.loading .btn-label { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-note { text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted); }
    .footer-note a { color: var(--brand); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon"><i class="fa fa-chart-line"></i></div>
      <div>
        <div class="brand-name">AWO ERP</div>
        <div class="brand-tagline">Business Management</div>
      </div>
    </div>

    <h1>Create account</h1>
    <p class="subtitle">Register a new user for your workspace</p>

    <div class="alert error" id="errorBox">
      <i class="fa fa-circle-exclamation"></i>
      <span id="errorMsg"></span>
    </div>

    <div class="alert success" id="successBox">
      <i class="fa fa-circle-check"></i>
      <span id="successMsg">Account created. Redirecting to sign in…</span>
    </div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="fullName">Full name</label>
        <div class="input-wrap">
          <i class="fa fa-user input-icon"></i>
          <input type="text" id="fullName" name="full_name" placeholder="Jane Doe" autocomplete="name">
        </div>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <i class="fa fa-envelope input-icon"></i>
          <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="fa fa-lock input-icon"></i>
          <input type="password" id="password" name="password" placeholder="••••••••"
                 autocomplete="new-password" required>
          <button type="button" class="password-toggle" id="pwToggle" aria-label="Show password">
            <i class="fa fa-eye" id="pwToggleIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <div class="spinner"></div>
        <span class="btn-label">Create account</span>
      </button>
    </form>

    <div class="footer-note">
      Already have an account? <a href="/pages/login.html">Sign in</a>
    </div>
  </div>

  <script>
    (function () {
      // Theme
      var stored = localStorage.getItem('awo-theme') || 'system';
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (stored === 'system' && prefersDark)) {
        document.documentElement.classList.add('dark');
      }

      // Password toggle
      var pwInput = document.getElementById('password');
      var pwToggle = document.getElementById('pwToggle');
      var pwIcon = document.getElementById('pwToggleIcon');
      pwToggle.addEventListener('click', function () {
        var show = pwInput.type === 'password';
        pwInput.type = show ? 'text' : 'password';
        pwIcon.className = show ? 'fa fa-eye-slash' : 'fa fa-eye';
      });

      var urlParams = new URLSearchParams(window.location.search);
      function tenantID() { return urlParams.get('tenant_id') || ''; }

      var form = document.getElementById('registerForm');
      var submitBtn = document.getElementById('submitBtn');
      var errorBox = document.getElementById('errorBox');
      var errorMsg = document.getElementById('errorMsg');
      var successBox = document.getElementById('successBox');

      function showError(msg) {
        successBox.classList.remove('visible');
        errorMsg.textContent = msg || 'Registration failed. Please try again.';
        errorBox.classList.add('visible');
      }

      function showSuccess() {
        errorBox.classList.remove('visible');
        successBox.classList.add('visible');
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        submitBtn.classList.toggle('loading', loading);
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorBox.classList.remove('visible');

        var fullName = document.getElementById('fullName').value.trim();
        var email    = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        var tid      = tenantID();

        if (!email || !password) {
          showError('Email and password are required.');
          return;
        }

        setLoading(true);

        try {
          var res = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'same-origin',
            body: JSON.stringify({
              email:     email,
              password:  password,
              full_name: fullName,
              tenant_id: tid
            })
          });

          var body = await res.json().catch(function () { return {}; });

          if (res.status === 201) {
            showSuccess();
            setTimeout(function () {
              var next = '/pages/login.html' + (tid ? '?tenant_id=' + encodeURIComponent(tid) : '');
              window.location.href = next;
            }, 1500);
            return;
          }

          var msg = body.message || body.error || body.msg || 'Registration failed.';
          showError(msg);
        } catch (err) {
          showError('Network error. Please check your connection and try again.');
        }

        setLoading(false);
      });

      document.getElementById('fullName').focus();
    })();
  </script>
</body>
</html>
